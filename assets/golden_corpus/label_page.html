thể bắt đầu quyết định các khoản mới.\n\nKhoản đã trả không thể được cứu bằng một lần trả thêm; điều cần xem là từ hôm nay khoản đó còn lấy gì và còn cho bạn điều gì. Video này không nói bạn phải hủy mọi dịch vụ, bỏ mọi kế hoạch, hay coi nhẹ một lần mua đã không đi như dự tính. Chúng ta chỉ cùng tách hai câu hỏi thường bị trộn lại: “Mình đã bỏ vào điều gì?” và “Nếu tiếp tục, từ bây giờ mình còn phải bỏ vào điều gì để nhận lại điều gì?”\n\nSự tách ra nghe nhỏ, nhưng nó thay đổi cách bạn đứng trước một quyết định chi tiêu. Thay vì cố làm một khoản cũ bớt tiếc bằng cách tiếp tục, bạn có thể nhìn lần lựa chọn tiếp theo như một lựa chọn riêng. Và đó là điểm bắt đầu để hiểu hiệu ứng chi phí chìm trong đời sống tiền bạc."},{"speaker":"narrator","purpose":"explanation","voiceover":"Tên của hiện tượng hôm nay là hiệu ứng chi phí chìm. “Chi phí chìm” không phải một khoản chi bí mật, cũng không phải nhãn để kết luận một người quản lý tiền tốt hay tệ. Nó chỉ là phần tiền, thời gian hoặc công sức đã bỏ ra mà quyết định sắp tới không thể thay đổi bằng cách quay lại quá khứ.\n\nHal Arkes và Catherine Blumer, trong bài báo năm 1985 mang tên The Psychology of Sunk Cost, mô tả xu hướng tiếp tục một việc sau khi đã đầu tư tiền, công sức hoặc thời gian. Cách gọi tên này hữu ích vì nó làm rõ một điều: một khoản đã bỏ vào có thể tiếp tục xuất hiện trong lập luận của ta, ngay cả khi điều đang cần quyết định là khoản tiếp theo.\n\nVí dụ, bạn đã trả cho một ứng dụng học ngoại ngữ sáu tháng. Số tiền sáu tháng đó đã được thanh toán. Dù hôm nay bạn gia hạn hay không, nó cũng không quay lại. Nhưng nếu bạn gia hạn, bạn sẽ có thêm một khoản mới, thêm một kỳ sử dụng mới, và có thể thêm áp lực phải dùng cho “đáng tiền”. Nếu bạn không gia hạn, bạn có thể thấy tiếc khoản cũ. Hai cảm giác này đều có thật. Tuy nhiên, chúng không phải là câu trả lời cho cùng một câu hỏi.\n\nCâu hỏi về quá khứ là: “Mình đã nhận được gì, đã kỳ vọng gì, và còn tiếc điều gì?” Câu hỏi về tương lai gần là: “Trong kỳ tiếp theo, mình có dự định dùng cụ thể nào, có thời gian nào, có nhu cầu nào, và khoản này sẽ lấy thêm bao nhiêu tiền hoặc công sức?” Khi chỉ dùng câu “đã trả rồi” để trả lời cho câu thứ hai, phần quá khứ đang có tiếng nói lớn hơn phần hiện tại.\n\nĐiều này không có nghĩa tiếp tục luôn là một lựa chọn không phù hợp. Có thể dịch vụ vẫn giúp bạn làm việc. Có thể khóa học vẫn đáp ứng đúng mục tiêu hiện tại. Có thể chuyến đi vẫn là điều bạn muốn trải nghiệm. Khi đó, lý do để tiếp tục nằm ở giá trị sắp nhận, không chỉ ở số tiền đã mất. Hiệu ứng chi phí chìm đáng để chú ý khi khoản đã qua trở thành lý do chính, hoặc lý do duy nhất, cho việc bỏ thêm nguồn lực vào một lựa chọn không còn được kiểm tra.\n\nVì vậy, video không đưa ra một mệnh lệnh “cắt ngay”. Nó mời bạn đổi thứ tự nhìn: trước tiên công nhận phần đã qua; sau đó nhìn riêng phần còn phải chọn. Cách làm này không xóa cảm giác tiếc, nhưng tạo ra một khoảng dừng để cảm giác ấy không tự động bấm nút thay bạn."},{"speaker":"narrator","purpose":"evidence","voiceover":"Hiệu ứng chi phí chìm không chỉ là một cách mô tả cảm giác tiếc tiền. Trong bài báo của Arkes và Blumer, các tác giả trình bày những tình huống nghiên cứu về việc con người có thể tiếp tục một hoạt động sau khi đã đầu tư vào nó. Bài báo cũng báo cáo một nghiên cứu thực địa liên quan đến vé mùa xem kịch.\n\nTrong bối cảnh vé mùa đó, những người mua vé với mức giá ban đầu cao hơn đã đi xem nhiều buổi hơn trong sáu tháng tiếp theo. Đây là một quan sát trong một hoàn cảnh cụ thể: vé mùa, các mức giá ban đầu khác nhau, và hành vi đi xem trong khoảng thời gian được nghiên cứu. Nó không cho phép chúng ta dự báo mọi người sẽ phản ứng giống nhau với mọi hóa đơn, mọi khoản đăng ký hay mọi quyết định cá nhân.\n\nGiá trị của kết quả không nằm ở việc biến nó thành câu nói “ai trả nhiều cũng sẽ cố dùng nhiều”. Con người, hoàn cảnh và lý do tiếp tục rất khác nhau. Giá trị nằm ở chỗ nó cho thấy khoản đã trả có thể đi vào hành vi tiếp tục sử dụng. Điều đó phù hợp với trải nghiệm đời thường khi ta thấy mình ép bản thân dùng một thứ không còn muốn dùng, chỉ để tránh cảm giác số tiền ban đầu trở nên vô ích.\n\nHãy quay lại với vé sự kiện. Nếu bạn vẫn muốn đi, trải nghiệm sắp tới vẫn đáng với tối cuối tuần, quãng đường, sức lực và chi phí phát sinh, việc đi có thể hoàn toàn hợp lý. Nhưng nếu bạn đã không còn muốn đi, vẫn ép mình đi chỉ vì vé đã mua, thì giá vé cũ đang được dùng để mở khóa thêm một chuỗi quyết định mới: gọi xe, bỏ thời gian nghỉ, ăn vội, hoặc gác một công việc khác.\n\nVé cũ không biến mất nếu bạn thay đổi kế hoạch. Nhưng việc đi chỉ để “cho đáng tiền vé” cũng không làm tiền vé trở thành một món quà. Câu hỏi có ích hơn là: “Nếu hôm nay vé này chưa nằm trong tay, mình có sẵn sàng đổi thời gian, năng lượng và chi phí đi lại để nhận trải nghiệm đó không?” Câu trả lời có thể là có. Cũng có thể là không. Điểm quan trọng là câu hỏi đã đưa sự chú ý trở lại điều sẽ xảy ra từ bây giờ.\n\nĐây cũng là giới hạn cần giữ khi dùng kiến thức tâm lý tài chính. Khái niệm giúp bạn xem lại một nguồn sai lệch trong lập luận, chứ không thay bạn quyết định về mục tiêu, trách nhiệm hoặc hoàn cảnh riêng. Nếu một khoản chi gắn với nghĩa vụ hợp đồng, nợ, thuế, bảo hiểm, đầu tư hoặc một quyết định tài chính quan trọng, hãy xem điều khoản cụ thể và cân nhắc hỏi chuyên gia phù hợp trước khi hành động."},{"speaker":"narrator","purpose":"example","voiceover":"Hãy lấy một tình huống rất quen thuộc: Minh mua một phần mềm chỉnh ảnh cho dự án cá nhân. Tháng đầu, Minh dùng nhiều vì đang hào hứng. Minh xem hướng dẫn, thử tính năng, chỉnh vài bộ ảnh và nghĩ rằng mình sẽ duy trì dự án trong thời gian dài.\n\nHai tháng sau, công việc chính thay đổi. Dự án cá nhân không còn là ưu tiên. Mỗi lần mở phần mềm, Minh chỉ xem qua vài phút rồi đóng lại vì không biết nên làm gì tiếp. Đến khi email gia hạn xuất hiện, Minh nhớ số tiền đã trả cho gói năm. Suy nghĩ đầu tiên là: “Nếu hủy lúc này thì khoản mua ban đầu thành vô ích.”\n\nCâu này nói đúng một điều: Minh đang tiếc khoản mua ban đầu. Nhưng nó chưa nói phần mềm trong thời hạn mới có phục vụ một dự án cụ thể nào hay không. Nó chưa nói Minh có thời gian dùng hay không. Nó chưa nói Minh sẽ nhận được điều gì nếu trả thêm. Khi những câu hỏi đó không xuất hiện, việc gia hạn rất dễ trở thành nỗ lực cứu cảm giác về một quyết định cũ.\n\nMinh không cần kết luận rằng mình đã tiêu tiền sai. Quyết định mua ban đầu có thể phù hợp với thông tin và mong muốn ở thời điểm đó. Dự án đổi hướng không biến Minh thành người thiếu kỷ luật. Nó chỉ tạo ra thông tin mới. Trong bối cảnh mới, Minh có thể hỏi: “Trong kỳ tiếp theo, mình có một dự án đã xác định cần phần mềm này không?” Nếu có, Minh có thể đánh giá tiếp bằng nhu cầu của dự án đó. Nếu chưa có, Minh có thể tắt gia hạn tự động, đặt ngày xem lại trước khi hết hạn, hoặc đơn giản không tạo thêm khoản mới trong hôm nay.\n\nMột ví dụ khác là Lan mua bộ dụng cụ pha cà phê tại nhà vì muốn giảm việc mua đồ uống bên ngoài. Ý định ban đầu có thể rất cụ thể. Lan xem video hướng dẫn, chọn hạt, mua vài món cơ bản và dự định mỗi sáng sẽ dùng. Sau vài tuần, lịch làm việc đổi. Buổi sáng Lan thường vội. Bộ dụng cụ nằm trong tủ, còn Lan bắt đầu mua thêm ly, phụ kiện và hạt mới vì nghĩ “đã đầu tư rồi thì phải dùng cho đáng”.\n\nỞ đây, mỗi món mua thêm dễ được kể như một cách cứu khoản mua đầu tiên. Nhưng từng món sau vẫn là một khoản mới. Lan có thể hỏi: “Trong bốn tuần tới, mình có buổi sáng nào thật sự có thời gian và muốn dùng bộ này không?” Nếu câu trả lời là có, phụ kiện có thể được xem bằng lần dùng cụ thể đó. Nếu câu trả lời chưa rõ, việc không mua thêm không phủ nhận ý định ban đầu. Nó chỉ ngăn ý định ban đầu kéo dài thành chuỗi chi tiêu không được kiểm tra.\n\nHai ví dụ này có một điểm chung: lựa chọn cũ là dữ liệu, không phải hóa đơn buộc bạn phải tiếp tục. Dữ liệu có thể cho biết điều gì từng quan trọng, điều gì đã thay đổi, và lần sau cần xem trước điều gì. Nhưng dữ liệu không cần được biến thành một lời buộc tội về bản thân."},{"speaker":"narrator","purpose":"explanation","voiceover":"Một lý do khiến hiệu ứng chi phí chìm khó nhận ra là nó không chỉ liên quan đến tiền. Tiền thường dễ thấy vì có sao kê, hóa đơn hoặc thông báo trừ tiền. Thời gian và công sức khó thấy hơn. Chúng nằm trong những buổi tối đã bỏ ra, những lần tìm hiểu, những cuộc trò chuyện, những kế hoạch đã sắp xếp, hoặc hình dung về con người mà ta muốn trở thành.\n\nBạn có thể đã đăng ký một chuỗi buổi học kỹ năng. Sau vài buổi, bạn nhận ra nội dung không còn giải quyết điều mình cần trong công việc. Nhưng mỗi lần nghĩ đến việc nghỉ, bạn lại nhớ phí học và các buổi tối đã ngồi nghe trước đó. Bạn nói: “Mình đã theo đến đây rồi, giờ bỏ thì quá uổng.”\n\nCảm giác ấy có lý do cảm xúc. Công sức là một phần của câu chuyện bạn kể về chính mình. Khi dừng, có thể bạn không chỉ thấy tiếc tiền; bạn còn thấy như đang thừa nhận kế hoạch ban đầu không đi theo hướng mong đợi. Vì vậy, tiếp tục đôi khi giống một cách trì hoãn cảm giác thất vọng về bản thân.\n\nTuy nhiên, buổi học đã qua không thể được thay đổi bằng cách có mặt ở buổi sau. Buổi sau vẫn sẽ lấy một buổi tối, năng lượng và sự chú ý. Nếu nội dung buổi sau có điều bạn thật sự muốn nhận, bạn có thể đi vì lý do đó. Nếu lý do duy nhất còn lại là “mình đã bỏ nhiều rồi”, bạn có một tín hiệu để xem lại.\n\nĐiều này khác với việc coi mọi sự kiên trì là không hợp lý. Có những việc cần thời gian mới thấy kết quả. Có những cam kết vẫn phù hợp với giá trị, mục tiêu hoặc trách nhiệm hiện tại. Có những khoản chi cần được tiếp tục vì điều kiện thực tế. Hiệu ứng chi phí chìm không phải một nhãn để phủ định sự bền bỉ. Câu hỏi cần giữ là: phần đã qua đang cung cấp bối cảnh, hay đang thay thế hoàn toàn cho lý do của lần lựa chọn tiếp theo?\n\nNếu bạn tiếp tục một lớp học vì kỹ năng đó vẫn cần cho công việc đang làm, vì lịch tuần vẫn có chỗ học, và vì bạn muốn nhận phần nội dung tiếp theo, bạn đang có các lý do thuộc về hiện tại. Nếu bạn chỉ tiếp tục để không phải gọi khoản cũ là lãng phí, thì phần quá khứ đang kéo cuộc quyết định đi xa hơn.\n\nMột cách nói trung tính có thể giúp trong lúc này: “Mình đã kỳ vọng khác, nên mình tiếc. Nhưng từ hôm nay, mình còn muốn đổi thêm điều gì để nhận lại điều gì?” Câu nói không bắt bạn phải cắt ngay. Nó chỉ tách cảm giác tiếc khỏi bước hành động. Khoảng giữa hai việc đó chính là nơi bạn có thể xem lại lựa chọn mà không tự xét xử mình."},{"speaker":"narrator","purpose":"application","voiceover":"Khi bạn thấy mình nghiêng về một khoản chi chỉ vì câu “đã lỡ rồi”, hãy thử một phép ghi rất ngắn. Không cần mở bảng tính lớn. Không cần biến một hóa đơn thành buổi tự kiểm điểm kéo dài. Chỉ cần lấy giấy hoặc mở ghi chú, rồi chia thành hai cột.\n\nCột đầu đặt tên là: “Không đổi được.” Ở đây, bạn ghi những gì đã xảy ra trước hôm nay: tiền đã thanh toán, thời gian đã bỏ ra, công sức đã dành, hoặc món đã mua. Cột này không dùng để phán xét. Nó chỉ ghi nhận sự thật. Ví dụ: “Đã trả ba tháng dịch vụ”, “Đã mua bộ dụng cụ”, “Đã dành bốn buổi tối cho khóa học”.\n\nCột thứ hai đặt tên là: “Còn phải chọn.” Ở đây, bạn ghi thật cụ thể những gì sẽ xảy ra nếu tiếp tục: kỳ thanh toán kế tiếp, thời gian dự kiến dùng, việc khác phải nhường chỗ, khoản mua thêm có thể phát sinh, và điều bạn hy vọng nhận lại. Ví dụ: “Tuần tới trả thêm một kỳ”, “Cần hai buổi tối để học”, “Có dự án chỉnh ảnh trong tháng sau hay không”, “Món phụ kiện này có phục vụ lần dùng nào đã có lịch hay không”.\n\nSau đó, khoanh một mục ở cột thứ hai mà bạn có thể kiểm tra bằng đời sống thật. Có thể là: “Trong 14 ngày tới, mình có hai buổi đã định rõ để dùng gói này không?” Có thể là: “Nếu không mua thêm hôm nay, mình có bỏ lỡ một lần dùng cụ thể nào không?” Có thể là: “Mình có đang xếp lịch cho phiên bản lý tưởng của mình, hay đang nhìn lịch thật?”\n\nĐiểm quan trọng là không biến câu hỏi thành lời hứa chung chung như “Từ giờ mình sẽ chăm hơn”. Đó là một lời hứa về bản thân, chưa phải dữ liệu về khoản chi. Hãy nhìn những gì đã có trong lịch, trong công việc, trong nhu cầu và trong bối cảnh thực tế. Nếu không có dữ liệu rõ, bạn có thể chọn một khoảng chờ trước khi mua thêm hoặc để kỳ gia hạn tiếp theo được quyết định lại.\n\nKhoảng chờ không phải hình phạt. Nó là cách để hóa đơn cũ không chen lên trước khi bạn nhìn thấy phần tương lai. Với một dịch vụ định kỳ, bạn có thể tắt gia hạn tự động để lần sau phải được xem lại có chủ ý. Với một món phụ kiện, bạn có thể để giỏ hàng qua ngày mai. Với một khóa học, bạn có thể đánh dấu một buổi sắp tới có nội dung cụ thể rồi xem nó có còn khớp với điều mình cần không.\n\nNếu bạn vừa nhận được giá trị từ hai cột này, tức là bạn đã có một cách biến cảm giác “bỏ thì phí” thành các điều kiện có thể nhìn thấy. Nếu cách nhìn ấy hữu ích, bạn có thể bấm thích video để 1 Cốc Café 6h biết những nội dung tâm lý tài chính có kiểm chứng đang giúp bạn dừng lại trước một lần trả thêm."},{"speaker":"narrator","purpose":"example","voiceover":"Hiệu ứng chi phí chìm cũng có thể ẩn trong những khoản không được thanh toán chỉ một lần. Có những khoản được thêm từng chút: phí duy trì, tiền sửa chữa, phí giao hàng để hoàn tất một đơn cũ, chi phí nâng cấp, hoặc các món lặt vặt để làm cho món ban đầu “đáng dùng hơn”. Vì mỗi lần thêm có vẻ nhỏ hơn khoản đầu tiên, ta có thể không nhận ra mình đang bảo vệ một quyết định cũ.\n\nGiả sử Huy mua một chiếc vali cho chuyến đi dự định từ nhiều tháng trước. Huy đã xem lịch, tìm nơi ở, mua vài món cần thiết và dành những buổi tối để chuẩn bị. Gần ngày đi, lịch công việc đổi. Chuyến đi không còn phù hợp như lúc đầu. Huy bắt đầu nghĩ mình nên cố đi vì vali đã mua, quần áo đã chuẩn bị và quá nhiều công sức đã bỏ vào.\n\nVali không hết giá trị chỉ vì chuyến đi đổi. Nó vẫn là một đồ vật có thể dùng trong hoàn cảnh khác, vào thời điểm khác, hoặc được xử lý theo cách phù hợp với Huy. Điều chưa xảy ra là chuyến đi sắp tới: số ngày nghỉ, chi phí di chuyển, năng lượng tổ chức và những công việc cần sắp xếp. Nếu Huy quyết định đi, lý do có thể là chuyến đi vẫn có ý nghĩa với điều Huy muốn ở thời điểm này. Nếu Huy quyết định không đi, Huy không làm cho chiếc vali trở thành một quyết định tệ hơn. Huy chỉ không dùng một vật đã mua để buộc cả lịch tương lai phải đi theo.\n\nMột ví dụ nhỏ hơn là món đồ sở thích ở nhà. Bạn mua một chiếc máy, một bộ dụng cụ hoặc một món phục vụ hoạt động cuối tuần. Sau đó món đồ ít được dùng. Bạn bắt đầu tìm thêm khóa học, phụ kiện, hộp đựng và vật dụng đi kèm vì nghĩ “đã mua rồi thì phải tận dụng”. Có thể một phụ kiện thật sự giải quyết một trở ngại cụ thể và giúp món đồ được dùng. Nhưng điều đó cần được đánh giá bằng lần dùng sắp tới, không chỉ bằng sự tồn tại của món đồ cũ.\n\nHãy bắt đầu bằng một câu hỏi rất cụ thể: “Lần dùng tiếp theo là khi nào, ở đâu, và món mua thêm này giải quyết trực tiếp điều gì cho lần đó?” Nếu bạn có một ngày, một bối cảnh và một nhu cầu rõ, bạn có dữ liệu để cân nhắc. Nếu bạn không hình dung được lần đó, giỏ hàng mới có thể đang phục vụ cảm giác muốn chứng minh khoản đầu tiên vẫn xứng đáng.\n\nĐiều này không đòi hỏi bạn vứt bỏ món đồ, cắt mọi kế hoạch hay làm cho quyết định trở nên kịch tính. Nó chỉ yêu cầu mỗi khoản phát sinh sau đó có một lý do mới. Một món đã mua không tự trả lời cho món sắp mua. Một vé đã mua không tự trả lời cho tối cuối tuần. Một khóa học đã học vài buổi không tự trả lời cho buổi tối sắp tới. Khi nhìn rõ trình tự này, bạn bớt phải dùng tương lai để sửa câu chuyện của quá khứ."},{"speaker":"narrator","purpose":"context","voiceover":"Có một cạm bẫy khi áp dụng kiến thức này: biến việc xem lại chi phí chìm thành một phiên tòa cho mọi quyết định đã mua. Nếu mỗi hóa đơn nhỏ đều khiến bạn mở ghi chú hàng giờ, cố chứng minh mình đúng hay sai, bản thân việc phân tích có thể trở thành một gánh nặng mới.\n\nVì vậy, phạm vi rất quan trọng. Hãy dùng cách xem lại này cho một khoản đang khiến bạn lặp lại câu “bỏ thì phí”, một khoản có lần trả tiếp theo rõ ràng, hoặc một lựa chọn đang lấy thêm thời gian và năng lượng. Với khoản nhỏ đã kết thúc, đôi khi chỉ cần ghi nhận rồi đi tiếp. Mục tiêu là tạo một khoảng dừng đúng lúc, không phải tối ưu hóa từng quyết định trong quá khứ.\n\nCũng cần tránh một cách hiểu cực đoan khác: coi mọi sự tiếp tục là do hiệu ứng chi phí chìm. Có những việc cần thời gian để tạo ra giá trị. Có những cam kết liên quan đến người khác, nên việc thay đổi cần được trao đổi và xem xét hệ quả. Có những dịch vụ hoặc công cụ vẫn phù hợp, dù bạn từng phân vân về việc đã trả tiền. Hành động bề ngoài có thể giống nhau: cả hai người đều giữ một gói dịch vụ. Nhưng lý do có thể rất khác.\n\nMột người giữ gói vì nó vẫn phục vụ công việc đang diễn ra, lịch thật có chỗ dùng, và lợi ích sắp nhận được nói rõ. Một người khác giữ gói chỉ vì không muốn nhìn vào hóa đơn cũ. Video này không quyết định thay ai. Nó chỉ giúp bạn nhận ra sự khác biệt giữa “mình tiếp tục vì điều mình còn muốn nhận” và “mình tiếp tục vì điều mình đã mất”.\n\nKhi khoản chi có người khác liên quan, hãy đưa cả trách nhiệm hiện tại vào phần “còn phải chọn”. Bạn có thể đã góp tiền cho kế hoạch chung, đăng ký cùng bạn bè, hoặc hứa với người thân. Việc nhận ra khoản cũ không có nghĩa được phép bỏ mặc cam kết đang tồn tại. Điều cần tách là: phần nào là trách nhiệm hiện tại với người khác, phần nào chỉ là áp lực muốn cứu tiền hoặc công sức đã qua. Trao đổi sớm, xem điều khoản và hiểu hệ quả thực tế thường hữu ích hơn việc âm thầm kéo dài một lựa chọn chỉ vì ngại nói.\n\nCó những lúc bạn không thể dừng ngay, dù đã nhận ra hiệu ứng chi phí chìm. Điều đó không làm việc nhận ra trở nên vô ích. Bạn vẫn có thể chọn bước nhỏ hơn: không mua thêm phụ kiện, không để gia hạn diễn ra hoàn toàn tự động, đặt một ngày xem lại, ghi lý do tiếp tục bằng một câu thuộc về tương lai, hoặc dừng dùng lời “đã lỡ” như lý do duy nhất.\n\nKhoảng giữa nhận ra và hành động là phần quan trọng. Ở đó, bạn không cần giả vờ quá khứ chưa từng tồn tại. Bạn chỉ cần không để quá khứ âm thầm ký thay cho lịch, tiền và năng lượng của tương lai."},{"speaker":"narrator","purpose":"payoff","voiceover":"Tóm lại, hiệu ứng chi phí chìm không nói tiền, thời gian hay công sức đã bỏ ra là không quan trọng. Chính vì chúng quan trọng nên cảm giác tiếc mới có sức nặng. Điểm cần giữ là: chúng thuộc về phần đã xảy ra của quyết định. Khi bạn sắp gia hạn, sắp mua thêm, sắp đi tiếp một kế hoạch, hãy xem phần sắp trả có lý do riêng trong đời sống hiện tại hay không.\n\nBạn có thể dùng ba câu đơn giản. Một: “Khoản nào đã trả và không thay đổi dù mình chọn gì tiếp?” Hai: “Từ hôm nay đến lần xem lại kế tiếp, mình sẽ trả thêm tiền, thời gian hoặc công sức nào?” Ba: “Nếu hôm nay chưa từng mua, với thông tin hiện có, mình có bắt đầu không?”\n\nBa câu này không bảo đảm một quyết định hoàn hảo. Chúng cũng không yêu cầu bạn phải hủy mọi thứ không dùng đủ. Chúng chỉ giúp phần tương lai có mặt đầy đủ hơn trong lúc hóa đơn cũ, kế hoạch cũ hoặc cảm giác tiếc đang nói quá to.\n\nNếu câu trả lời là khoản đó vẫn phù hợp, bạn tiếp tục vì điều bạn còn muốn nhận. Nếu câu trả lời là chưa rõ, bạn có thể tạo khoảng chờ hoặc đặt ngày xem lại. Nếu câu trả lời là không còn phù hợp, bạn có thể dừng mà không cần biến quyết định cũ thành bằng chứng chống lại bản thân. Một khoản không đi như dự tính vẫn có thể cho bạn thông tin: lần sau cần biết điều gì trước khi mua, cần chọn thời hạn khác, hay cần đặt một thời điểm xem lại sớm hơn.\n\nHãy mở một khoản chi không thiết yếu có lần gia hạn hoặc lần mua thêm trong 7 ngày tới, rồi viết ba dòng: khoản nào đã trả, khoản nào sẽ trả thêm, và nếu chưa từng mua hôm nay bạn có bắt đầu không.\n\nNếu video giúp bạn gọi đúng cảm giác “đã bỏ rồi nên phải tiếp tục”, hãy thích video để 1 Cốc Café 6h tiếp tục làm những tập tâm lý tài chính có kiểm chứng. Và hãy đăng ký kênh để xem các video sau về cách những câu chuyện trong đầu có thể đổi cách ta nhìn tiền. Tập tiếp theo, chúng ta sẽ xem vì sao cùng một khoản tiền nhưng nguồn tiền khác nhau có thể làm lựa chọn chi tiêu thay đổi. Bạn đang có khoản nào khiến câu “bỏ thì phí” xuất hiện nhiều nhất?"}],"machine":{"source":"script.quality_review.qa","passed":false,"overall_score":null,"dimension_scores":{},"violated_rules":["health_finance_claim"],"blocking_findings":["Phát hiện tuyên bố y tế/tài chính tuyệt đối hoặc áp dụng cho mọi người."]}}]};
const KEY = "ytb-editorial-labels-v1";

let labels = {};
try { labels = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { labels = {}; }

let current = 0;
let draft = {};

const $ = (id) => document.getElementById(id);
const SPEAKER = { narrator: "Người kể" };

function persist() {
  try { localStorage.setItem(KEY, JSON.stringify(labels)); } catch (e) { /* private window */ }
  const done = Object.keys(labels).length;
  $("done").textContent = done;
  $("out").value = done ? JSON.stringify(labels, null, 1) : "";
  renderRail();
}

function renderRail() {
  const rail = $("rail");
  rail.replaceChildren(...DATA.items.map((item, i) => {
    const b = document.createElement("button");
    b.textContent = i + 1;
    b.dataset.done = String(Boolean(labels[item.id]));
    if (i === current) b.setAttribute("aria-current", "true");
    b.title = item.title;
    b.addEventListener("click", () => go(i));
    return b;
  }));
}

function renderDims() {
  const saved = labels[DATA.items[current].id];
  draft = saved ? { ...saved.scores } : {};
  $("dims").replaceChildren(...DATA.dimensions.map(({ key, help }) => {
    const wrap = document.createElement("div");
    wrap.className = "dim";

    const name = document.createElement("div");
    name.className = "dim-name";
    const label = document.createElement("span");
    label.textContent = key.replace(/_/g, " ");
    const out = document.createElement("output");
    out.textContent = key in draft ? draft[key] : "–";
    name.append(label, out);

    const hint = document.createElement("p");
    hint.className = "dim-help";
    hint.textContent = help;

    const scale = document.createElement("div");
    scale.className = "scale";
    for (let n = 0; n <= 10; n++) {
      const b = document.createElement("button");
      b.textContent = n;
      b.setAttribute("aria-pressed", String(draft[key] === n));
      b.setAttribute("aria-label", `${key} ${n} điểm`);
      b.addEventListener("click", () => {
        draft[key] = n;
        out.textContent = n;
        [...scale.children].forEach((c, i) => c.setAttribute("aria-pressed", String(i === n)));
        $("save").disabled = DATA.dimensions.some((d) => !(d.key in draft));
      });
      scale.append(b);
    }
    wrap.append(name, hint, scale);
    return wrap;
  }));
  $("save").disabled = DATA.dimensions.some((d) => !(d.key in draft));
}

function renderVerdict(show) {
  const box = $("verdict");
  if (!show) { box.hidden = true; return; }
  const item = DATA.items[current];
  const m = item.machine;
  box.hidden = false;
  $("vsource").textContent = m.source === "editorial_review_cache"
    ? `Rubric LLM · tổng ${m.overall_score}/10 · ${m.passed ? "đạt" : "không đạt"}`
    : `Cổng QA tất định · ${m.passed ? "đạt" : "không đạt"} (không có điểm rubric)`;

  const rows = [];
  const dims = m.dimension_scores || {};
  for (const { key } of DATA.dimensions) {
    if (!(key in dims)) continue;
    const mine = draft[key];
    const gap = Math.abs(mine - dims[key]);
    const row = document.createElement("div");
    row.className = "row";
    const l = document.createElement("span");
    l.textContent = key.replace(/_/g, " ");
    const r = document.createElement("span");
    r.innerHTML = `bạn <b>${mine}</b> · máy <b>${dims[key]}</b> `;
    const tag = document.createElement("span");
    tag.className = gap <= 1 ? "gap-agree" : "gap-off";
    tag.textContent = gap <= 1 ? "khớp" : `lệch ${gap}`;
    r.append(tag);
    row.append(l, r);
    rows.push(row);
  }
  if (!rows.length) {
    const p = document.createElement("div");
    p.className = "row";
    p.textContent = "Bản ghi này chỉ có kết luận đạt/không đạt, không có điểm từng tiêu chí.";
    rows.push(p);
  }
  $("vrows").replaceChildren(...rows);

  $("vfindings").replaceChildren(...(m.blocking_findings || []).slice(0, 6).map((f) => {
    const li = document.createElement("li");
    li.textContent = f;
    return li;
  }));
  $("vrules").replaceChildren(...(m.violated_rules || []).map((r) => {
    const s = document.createElement("span");
    s.textContent = r;
    return s;
  }));
}

function go(index) {
  current = (index + DATA.items.length) % DATA.items.length;
  const item = DATA.items[current];

  $("title").textContent = item.title || "(không tiêu đề)";
  $("meta").replaceChildren(...[
    `${current + 1} / ${DATA.items.length}`,
    item.profile,
    item.videoType,
    `${item.sectionCount} mục`,
    `${item.totalChars.toLocaleString("vi-VN")} ký tự`,
  ].map((t) => { const s = document.createElement("span"); s.textContent = t; return s; }));

  $("transcript").replaceChildren(...item.sections.map((s) => {
    const row = document.createElement("div");
    row.className = "line";
    row.dataset.speaker = s.speaker;
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = SPEAKER[s.speaker] || s.speaker;
    const said = document.createElement("div");
    said.className = "said";
    said.textContent = s.voiceover;
    row.append(who, said);
    return row;
  }));

  renderDims();
  renderVerdict(Boolean(labels[item.id]));
  renderRail();
  window.scrollTo({ top: 0, behavior: "instant" });
}

$("save").addEventListener("click", () => {
  const item = DATA.items[current];
  labels[item.id] = { scores: { ...draft }, at: new Date().toISOString() };
  persist();
  renderVerdict(true);
});
$("next").addEventListener("click", () => go(current + 1));

$("total").textContent = DATA.items.length;
persist();
go(0);
</script>
