      <p class="note">Chọn hết ô dưới, copy, dán vào khung chat.</p>
      <textarea id="out" readonly spellcheck="false"></textarea>
    </section>
  </aside>
</main>

<script>
const DATA = {"dimensions":[{"key":"causal_coherence","help":"Chuyện có nhân quả thật không, hay chỉ là các cảnh xếp cạnh nhau?"},{"key":"human_truth","help":"Người trong truyện cư xử như người thật, hay như minh hoạ cho một luận điểm?"},{"key":"role_fidelity","help":"Mỗi người nói đúng vai mình — chủ quán không hoá thành nhà trị liệu?"},{"key":"spoken_naturalness","help":"Đọc thành tiếng một hơi được không, hay là văn viết đeo vào miệng người?"},{"key":"useful_restraint","help":"Có kìm được việc rút đạo lý hộ người xem không?"}],"items":[{"id":"012402813900d4eb","title":"Ngày Hàng Về Kho Chưa Ai Xác Nhận","profile":"ban-so-6","videoType":"long","sectionCount":24,"totalChars":6262,"sections":[{"speaker":"narrator","purpose":"situation","voiceover":"Sáu giờ lẻ hai phút. Bàn số 6 vẫn còn hơi lạnh từ ngoài kính. Minh ngồi trước chiếc laptop đã mở từ lúc mới vào, tách cà phê còn nguyên, lớp bọt mỏng đã vỡ gần hết. Trên màn hình là một bảng kế hoạch giao hàng phải chốt xong trong buổi họp lúc tám giờ ba mươi. Có một con số về ngày hàng về kho đang đợi cậu xác nhận, và nếu sáng nay cậu im lặng, con số đó sẽ đi vào bản cam kết gửi khách trước trưa. An đứng sau quầy, lau cùng một cái cốc lần thứ hai, vì cô nhìn thấy cà phê của Minh không vơi đi giống mọi sáng. Cậu không nhấp một ngụm nào, cũng không gõ phím liên tục như người đang làm việc. Cậu để ngón tay đặt trên mép bàn, thỉnh thoảng chạm vào bàn di chuột rồi rụt lại, như thể sợ nếu chạm thêm một lần nữa thì chuyện gì đó sẽ chạy ra ngoài ý muốn."},{"speaker":"an","purpose":"situation","voiceover":"Cà phê nguội rồi, cậu vẫn chưa uống à?"},{"speaker":"minh","purpose":"situation","voiceover":"Em đang sửa lại một chỗ. Để lát nữa uống."},{"speaker":"narrator","purpose":"situation","voiceover":"Minh đặt tay lên bàn phím, gõ thêm mấy chữ rồi lại xóa. Con trỏ trở về đầu dòng đã gần hai mươi phút. An không nói gì thêm, chỉ kéo khăn lau về phía cái cốc sạch. Cô nhận ra lần này Minh không mở hộp thư công việc như mọi hôm, mà quay đi quay lại đúng một trang tài liệu. Cái trang đó có một ô màu xám ở góc phải, nơi lẽ ra đã phải điền ngày hàng cập bến. Minh không nhìn ra cửa kính như người đang chờ trời sáng. Cậu nhìn vào ô trống ấy lâu hơn bình thường, rồi lại kéo lên đầu trang, nơi mấy dòng chữ đã cũ vẫn nằm nguyên từ tối qua."},{"speaker":"an","purpose":"situation","voiceover":"Trang này cậu mở nãy giờ không thấy chuyển sang trang khác."},{"speaker":"minh","purpose":"situation","voiceover":"Vì còn một ô em chưa biết điền gì."},{"speaker":"an","purpose":"situation","voiceover":"Ô nào?"},{"speaker":"minh","purpose":"core_answer","voiceover":"Ngày hàng về kho. Em có một con số, mà con số bên vận chuyển nhắn tối qua không giống với bên đang để trong tài liệu."},{"speaker":"narrator","purpose":"core_answer","voiceover":"Tối qua lúc mười một giờ, bên vận chuyển gửi thư báo lịch trình chậm hơn dự kiến. Con số trong tài liệu do một đồng nghiệp trẻ đã tổng hợp xong từ chiều, vẫn ghi ba ngày. Minh mở thư, đọc ba lần, rồi không gọi lại cho ai. Sáng nay cậu sửa tới sửa lui một dòng cảnh báo, rồi lại để nguyên vì sợ mình là người phá nhịp cuộc họp. Cậu cần giữ kế hoạch không bị trễ, nhưng cũng cần giữ cho mình không trở thành người đứng ra chặn một bản trình bày đã gần xong. Hai điều đó không ngồi chung một chỗ được. An nhìn cậu, chờ một câu tiếp theo, nhưng Minh chỉ im lặng và kéo con trỏ lên đầu trang lần nữa."},{"speaker":"an","purpose":"evidence","voiceover":"Thế cậu gọi lại cho bên đó chưa?"},{"speaker":"minh","purpose":"evidence","voiceover":"Chưa. Em định vào công ty rồi mới gọi."},{"speaker":"narrator","purpose":"evidence","voiceover":"An gật đầu rồi quay lại xếp mấy chiếc tách lên kệ. Cô không hỏi thêm. Minh biết câu hỏi của An không có ý bắt lỗi, nhưng nó vẫn đâm vào chỗ cậu đang né: mình đã có một đêm để xác nhận con số, và mình đã để nó trôi đến sáu giờ sáng. Cái giá đầu tiên không phải chuyện công ty phạt hay không phạt. Cái giá đầu tiên là cậu mất bình tĩnh ngay từ bàn quen, để tách cà phê nguội đi và không thể nói với An rằng mình sợ bị coi là người chậm hơn đúng một nhịp so với đồng nghiệp trẻ trong phòng họp."},{"speaker":"an","purpose":"application","voiceover":"Mà người ta đâu có ngồi chờ cậu tám giờ rưỡi."},{"speaker":"minh","purpose":"application","voiceover":"Em biết. Nhưng mà gọi giờ này họ cũng chưa lên ca."},{"speaker":"narrator","purpose":"evidence","voiceover":"Đúng lúc đó, điện thoại của Minh rung lên trên mặt bàn. Màn hình sáng lên một dòng nhắc cuộc họp tám giờ ba mươi còn chưa đầy hai tiếng. Cậu không mở, chỉ lật úp máy xuống. An nhìn theo tay cậu rồi quay đi, không nói gì. Hai người đều hiểu im lặng đó không giúp ô ngày hàng về kho tự đúng. Nhưng nói lúc này cũng không phải là một bước chắc chắn. Nó chỉ mở ra khả năng người khác hỏi lại đúng câu hỏi mà Minh đang cố không nghe: vì sao lại đợi đến sáng nay mới xử lý."},{"speaker":"minh","purpose":"application","voiceover":"Thôi em đi trước. Hôm nay vào sớm xem lại mail."},{"speaker":"an","purpose":"application","voiceover":"Ừ, cà phê tôi cất cho. Chiều ngang đây thì uống cái khác."},{"speaker":"narrator","purpose":"evidence","voiceover":"Bảy giờ mười lăm, xe buýt chạy dọc con đường ngập ánh vàng nhạt đầu ngày. Minh mở lại thư của bên vận chuyển trên điện thoại. Dưới dòng ghi lịch giao nhận là một ngày khác so với tài liệu đang chờ. Cậu đọc rồi tắt, lại mở, như thể mong lần thứ tư con số sẽ khác. Nhưng nó không khác. Điều cậu còn giữ được lúc này là lời hứa với trưởng phòng rằng kế hoạch giao hàng phải khớp với thực tế kho, chứ không phải khớp với bản trình bày đẹp nhất. Minh biết nếu mình im lặng, người khác sẽ ký xong. Nhưng đến lúc hàng không về đúng ngày, người nhận câu hỏi đầu tiên vẫn là cậu, vì chính cậu là người theo dõi chuỗi vận chuyển."},{"speaker":"narrator","purpose":"core_answer","voiceover":"Tám giờ hai mươi, phòng họp sáng đèn. Đồng nghiệp trẻ ngồi cuối dãy đã chiếu xong bản trình bày, từng trang lật nhanh, giọng đều và không phải dừng lại để tìm chỗ sai. Minh nhìn bảng kế hoạch hiện trên tường. Ngày hàng về kho vẫn là con số ba ngày. Cậu mở laptop, tìm đúng dòng cảnh báo đã soạn từ đêm, ngón tay đặt lên bàn di chuột. Căn phòng bắt đầu hỏi ý kiến chốt lần cuối. Minh hiểu chỉ cần mình không nói, buổi họp sẽ kết thúc đúng giờ, kế hoạch sẽ được in ra, và không ai biết ô ngày hàng về kho có thể đang sai. Nhưng cậu cũng hiểu nếu nói ra, cậu phải trả lời tiếp câu hỏi mình sợ nhất."},{"speaker":"minh","purpose":"core_answer","voiceover":"Cho em một phút. Ở phần ngày hàng về kho, em vẫn chưa xác nhận được với bên vận chuyển."},{"speaker":"narrator","purpose":"evidence","voiceover":"Câu trả lời từ đầu bàn không phải tiếng đồng tình. Một giọng hỏi lại vì sao tối qua không xác nhận luôn. Đồng nghiệp trẻ quay sang nhìn Minh, tay dừng ở con trỏ. Minh đã chuẩn bị cho câu đó từ sáng, nhưng khi nghe thật, cậu vẫn thấy cổ họng khô lại. Cái giá của việc nói thật lúc này là cậu phải thừa nhận mình đã chậm hơn đúng một nhịp so với người còn lại. Người ta đã tổng hợp xong từ chiều, còn cậu thì giữ một con số chưa gọi để chắc chắn đến tận bây giờ. Trong khoảng im lặng ngắn ấy, Minh nhìn thấy rõ vì sao mình đã muốn im lặng ngay từ đầu."},{"speaker":"minh","purpose":"core_answer","voiceover":"Vì tối qua em chỉ mới đọc thư, chưa gọi điện xác nhận được. Em không chắc con số trong tài liệu còn đúng không."},{"speaker":"narrator","purpose":"application","voiceover":"Cuộc họp không chốt kế hoạch như dự định. Người điều phối dời phần giao hàng sang mười giờ, yêu cầu Minh gọi cho bên vận chuyển và báo lại con số trước khi ký. Đồng nghiệp trẻ gấp laptop, đứng dậy trước, bỏ lại một câu rằng nếu con số cũ vẫn đúng thì mọi người mất thêm một tiếng. Minh ngồi yên thêm một lúc, nhìn ô xám trên màn hình vẫn chưa có gì được điền vào. Cậu không cảm thấy nhẹ hơn. Nhưng cậu cũng không còn phải giữ im lặng như sáng nay nữa. Việc còn lại là một cuộc điện thoại, và cậu không biết đầu dây bên kia có ai nhấc máy trước mười giờ hay không."},{"speaker":"narrator","purpose":"payoff","voiceover":"Có thể bạn cũng có những lúc nói ra một điều mình chưa chắc, rồi việc bị chậm lại đúng chỗ đó. Khi con số còn bỏ ngỏ, việc không để nó bị ký nhầm cũng là một cách giữ trách nhiệm. Tập sau, có lẽ đáng xem là cuộc gọi xác nhận có được nhấc máy trước mười giờ hay không, và nếu chưa kịp thì người ta sẽ làm gì với một con số vẫn chờ."}],"machine":{"source":"editorial_review_cache","passed":true,"overall_score":9,"dimension_scores":{"causal_coherence":9,"human_truth":9,"role_fidelity":9,"spoken_naturalness":9,"useful_restraint":9},"violated_rules":[],"blocking_findings":[]}},{"id":"04be0a564d0a2429","title":"Hai Lần Máy Bận, Một Tin Nhắn Gửi Đi","profile":"ban-so-6","videoType":"long","sectionCount":18,"totalChars":5848,"sections":[{"speaker":"narrator","purpose":"situation","voiceover":"Bảy giờ lẻ năm sáng. Bàn số sáu cạnh cửa kính, chỗ ngồi quen của Minh vẫn trống. Cậu ngồi lệch sang mép bên tường, áo khoác còn dính hơi nước từ cơn mưa nhỏ ngoài đường. Trước mặt chưa có cà phê. Điện thoại nằm trên mặt bàn, màn hình tối. Cậu còn một cuộc gọi cho bên kho để xác minh tuyến giao hàng trước bảy giờ ba mươi. Trong cuộc họp vừa xong, người ta đã giữ lại dòng rủi ro cậu nêu. Nếu không có câu trả lời từ kho, lô hàng có thể đi sai hướng đúng lịch đã chốt, và người bị gọi ra hỏi trước sẽ là Minh. Cậu không muốn lặp lại việc tối qua mình đã nói muộn, khi Duy đứng ở hành lang hỏi tại sao không nói sớm hơn. Câu hỏi đó vẫn chưa có câu trả lời. Trên mặt bàn gỗ sẫm, vết xước ở góc phải hằn rõ dưới ánh đèn vàng. Ngoài kia, xe máy đầu ngày chạy ngang, bánh xe hắt nước lên vỉa. Kim đồng hồ nhích thêm một vạch. An từ quầy nhìn ra, thấy cậu ngồi không phải ở vị trí mọi sáng, và chưa gọi cà phê như mọi hôm."},{"speaker":"an","purpose":"situation","voiceover":"Cà phê đây. Hôm nay cậu ngồi chỗ này à?"},{"speaker":"minh","purpose":"situation","voiceover":"Ghế bên cửa kính ướt. Em ngồi đây đỡ phải lau."},{"speaker":"narrator","purpose":"situation","voiceover":"Minh mở khóa điện thoại. Cậu bấm số kho rồi đưa điện thoại lên tai. Tiếng nhạc chờ vang lên bốn giây, rồi một tiếng bận dài chặn ngang. Cậu không nói gì, chỉ đặt điện thoại xuống bàn. Màn hình vẫn sáng ở cuộc gọi đã kết thúc. Đồng hồ trên tường chỉ bảy giờ mười. Hơi nóng từ tách cà phê bay lên rồi tan. Trên mặt bàn, một giọt nước từ mép ly chảy xuống, loang thành vệt sẫm trên gỗ. Minh nhìn vệt nước đó lâu hơn mức cần thiết, rồi chạm nhẹ vào cạnh điện thoại."},{"speaker":"minh","purpose":"situation","voiceover":"Máy bận."},{"speaker":"narrator","purpose":"situation","voiceover":"An quay về quầy, đặt khay gọn vào chỗ cũ. Cửa kính mở, một người đàn ông lớn tuổi vào gọi cà phê mang đi. Tiếng giày ướt dừng lại ở thảm lau chân. Minh nhìn theo tiếng chuông, rồi nhìn lại màn hình tối. Ly cà phê trên bàn chưa được chạm tới. Bên ngoài, mặt đường còn ướt, bóng người qua lại đổ dài trên vỉa. Đồng hồ nhích qua bảy giờ mười hai. An nói gì đó với khách. Cậu không nghe rõ; chỉ thấy người khách gật đầu rồi bước vào trong."},{"speaker":"an","purpose":"situation","voiceover":"Gọi lại chưa?"},{"speaker":"narrator","purpose":"situation","voiceover":"Minh bấm lại số kho. Lần này tiếng bận đến sớm hơn, sau một hồi chuông ngắn. Cậu tắt màn hình rồi lại mở lên, như để chắc giờ vẫn còn. Bảy giờ mười sáu. Khách ngồi gần cửa sổ kéo ghế. Tiếng ghế nhẹ như nhắc cậu thời gian đang trôi. Tách cà phê đã không còn hơi nóng. Minh nhìn dãy số trên màn hình, ngón tay dừng ở phím gọi."},{"speaker":"minh","purpose":"situation","voiceover":"Vẫn bận."},{"speaker":"narrator","purpose":"situation","voiceover":"Bảy giờ mười bảy. Điện thoại rung một cái trên mặt bàn. Màn hình sáng lên tên Duy: 'Gọi kho chưa? Hôm qua cậu nên nói từ tối.' Minh đọc rồi không trả lời. Ngón tay cậu dừng ở cạnh màn hình, rồi rời sang mép cuốn sổ nhỏ nhô ra khỏi túi áo khoác. Cậu rút nó ra, đặt lên bàn cạnh điện thoại, mở đúng trang còn trống. Vệt nước do ly cà phê để lại đã loang thành một đường dài trên mặt gỗ. Cậu lấy giấy ăn từ hộp trên bàn, lau ngang một đường, rồi vò tờ giấy lại trong lòng bàn tay. Điện thoại vẫn sáng, tin nhắn của Duy nằm yên ở giữa màn hình. Cậu bấm tắt, đặt úp máy xuống. Rồi cậu lại lật lên, mở danh bạ, nhìn số kho hiện ra. Cậu không bấm gọi. Cậu mở khung soạn thảo, gõ thử một dòng, chữ đầu tiên chưa kịp thành câu thì lại xóa. Ngoài cửa, một chiếc xe máy quẹt qua vũng nước, tiếng nước bắn nhẹ vào bậc thềm. Cậu nghe rõ tiếng đó, rồi nhìn xuống trang sổ trống. Mười ba phút còn lại trước bảy giờ ba mươi. Cậu vẫn ngồi yên, tay đặt trên mép bàn, không đứng lên."},{"speaker":"an","purpose":"core_answer","voiceover":"Cậu rút sổ ra rồi. Vậy cậu định viết rồi gửi, hay còn gọi lại? Cà phê nguội hết rồi, cậu chưa uống ngụm nào."},{"speaker":"minh","purpose":"core_answer","voiceover":"Em không chắc gọi thêm có thông không. Kho hay bận vào giờ này. Ghi ra thì mình còn cái để gửi, không phải ngồi canh máy thêm. Mà gửi tin nhắn, có khi họ cũng không trả lời liền."},{"speaker":"narrator","purpose":"evidence","voiceover":"Bảy giờ mười chín. Minh cúi xuống trang giấy đã mở sẵn. Ngòi bút đặt lên dòng kẻ đầu tiên, viết: kho số ba, lô tám, cần xác nhận trước bảy giờ ba mươi. Viết xong, cậu gạch chữ tám, sửa lại số lô thành chín, rồi đọc lại từ đầu. Cậu viết tiếp dòng thứ hai: chuyến giao chính ngày hôm nay, tuyến qua cầu Thị Nghè. Rồi dừng. Cậu không nhớ tên bên kho người hay gặp mỗi sáng là ai. Cậu mở điện thoại, tìm trong lịch sử cuộc gọi, lướt qua hai cuộc gọi bận lúc nãy. Không có tên, chỉ có số máy lạ. Cậu quay lại trang giấy, để trống dòng tên, viết tạm một chữ 'anh kho'. Bên ngoài, người bán rau dừng xe trước cửa, thùng hàng phủ bạt xanh. Cậu không ngước lên. Tiếng dây buộc cọ vào yên xe, rồi tiếng chân người bước xuống vỉa. Cậu bấm cho màn hình sáng lên, thấy vẫn bảy giờ mười chín. Cậu tắt đi, cầm bút lên, sửa chữ 'anh kho' thành 'anh ơi'. Rồi cậu bỏ bút xuống, vuốt lại mép giấy cho phẳng. Trang giấy giờ có ba dòng chữ chưa hoàn chỉnh. Cậu ngồi yên, nhìn nó. Tiếng radio phía quầy đổi bài, giọng ca trầm lẫn trong tiếng máy xay. An đi ngang qua bàn, không dừng lại. Cậu nghe bước chân cô nhẹ dần về phía quầy."},{"speaker":"narrator","purpose":"core_answer","voiceover":"Đến bảy giờ hai mươi. Minh kéo cuốn sổ nhỏ về phía mình, mở trang mới. Cậu viết từng dòng: kho nào, lô hàng nào, cần xác nhận gì trước bảy giờ ba mươi. Rồi cậu chụp lại trang giấy, gửi vào số máy bên kho. Đèn màn hình tắt sau hai giây. Cậu ngồi nhìn trang giấy, rồi đóng sổ lại. Ngoài cửa, một chiếc xe tải chạy chậm qua, nhạc chuông quán vang lên một đoạn ngắn. Không ai trả lời ở đầu bên kia."},{"speaker":"narrator","purpose":"evidence","voiceover":"Tin nhắn đã gửi. Không có dấu tích xanh, không có hồi đáp. Minh đóng sổ, đẩy ra giữa bàn. Cậu không đứng lên. Cậu ngồi yên, mắt vẫn dừng ở màn hình đen. Đáng lẽ xong việc thì có thể đứng dậy, nhưng cậu vẫn còn một khoảng trống chưa kịp gọi tên. Bên quầy, An đang rửa một chiếc tách, tiếng nước chảy rất nhỏ."},{"speaker":"an","purpose":"application","voiceover":"Cậu gửi tin cho bên kho rồi à? Điện thoại cậu nằm úp thế kia. Sáng nay tôi cũng gọi ba lần không được, phải nhắn cho bên giao bánh. Họ chiều mới trả lời. Tôi không gọi thêm."},{"speaker":"minh","purpose":"situation","voiceover":"Vậy à."},{"speaker":"narrator","purpose":"payoff","voiceover":"Cuộc gọi bận hai lần. Tin nhắn đã gửi đi, màn hình vẫn đen. Tách cà phê nguội cạnh cuốn sổ đã đóng. Bên ngoài, mặt đường còn ướt, người bán rau đã dắt xe đi. Có lẽ bạn cũng từng ngồi lại như vậy sau khi đã làm xong một việc khó, mà chưa thấy nhẹ hơn. Tập sau, hồi đáp từ bên kho, hoặc một lần cầm điện thoại lên giữa lúc quán đông hơn, khi chuông cửa lại reo."}],"machine":{"source":"editorial_review_cache","passed":true,"overall_score":9,"dimension_scores":{"causal_coherence":9,"human_truth":9,"role_fidelity":9,"spoken_naturalness":9,"useful_restraint":9},"violated_rules":[],"blocking_findings":[]}},{"id":"0536384cc9af0804","title":"Con Số Chưa Chắc Trước Cuộc Họp","profile":"ban-so-6","videoType":"short","sectionCount":12,"totalChars":1261,"sections":[{"speaker":"narrator","purpose":"situation","voiceover":"Bàn số 6. Số 48 phút chưa ai xác nhận, nhưng họp còn hai tiếng."},{"speaker":"narrator","purpose":"core_answer","voiceover":"Im lặng không làm con số chắc hơn, nó chỉ đẩy rủi ro vào đúng cuộc họp. Sáng nay điều đó đang ngồi ở bàn số 6, tay vẫn đặt trên điện thoại."},{"speaker":"an","purpose":"evidence","voiceover":"Thế cậu gọi lại cho bên đó chưa?"},{"speaker":"minh","purpose":"evidence","voiceover":"Chưa. Em còn đang nhìn lại tin nhắn hôm qua, xem họ có nhắc giờ xe rời kho không."},{"speaker":"an","purpose":"evidence","voiceover":"Tối qua cậu cũng xem rồi mà. Có thêm gì đâu."},{"speaker":"minh","purpose":"evidence","voiceover":"Nếu em nói 48 mà thực ra nó là 51, họ hỏi lại là em đứng im."},{"speaker":"an","purpose":"evidence","voiceover":"Cậu sợ họ hỏi lại câu gì?"},{"speaker":"minh","purpose":"application","voiceover":"Em gọi. Hỏi đúng một câu: chốt giờ xe rời kho hay giờ tới trạm trung chuyển. Nếu họ trả lời được thì em không phải đoán."},{"speaker":"narrator","purpose":"application","voiceover":"Bảy giờ kém mười lăm, bên vận chuyển nhắn lại: xe rời kho bảy giờ mười, không phải sáu giờ bốn mươi. Muộn ba mươi phút, cộng hai mươi mốt phút trung chuyển là năm mươi mốt. Minh ngồi thẳng lên, sửa dòng ghi chú từ 48 thành 51."},{"speaker":"an","purpose":"application","voiceover":"Sửa xong rồi à? Đưa đây tôi xem."},{"speaker":"minh","purpose":"evidence","voiceover":"51 phút. Nghe tệ hơn, nhưng ít ra em biết mình nói gì."},{"speaker":"narrator","purpose":"payoff","voiceover":"Có lẽ bạn cũng từng ngồi trước một con số chưa chắc và chọn im để khỏi bị hỏi ngược. Buổi sáng này không giải quyết cả cuộc họp, chỉ cho thấy một cuộc gọi nhỏ cũng đủ đổi con số thành thứ có thể nói ra trước mặt người khác. Cái giá không biến mất; nó chỉ hiện rõ hơn. Còn vì sao tối qua không nói sớm thì vẫn còn để ngỏ, và video dài về lần cậu ấy nêu rủi ro trong cuộc họp sẽ kể tiếp."}],"machine":{"source":"editorial_review_cache","passed":true,"overall_score":9,"dimension_scores":{"causal_coherence":9,"human_truth":9,"role_fidelity":10,"spoken_naturalness":9,"useful_restraint":10},"violated_rules":[],"blocking_findings":[]}},{"id":"380a6d041a3edc03","title":"Tỏ Ra Ổn Trên Mạng Khi Đời Đang Rối","profile":"one-cup-cafe-6h","videoType":"long","sectionCount":12,"totalChars":6589,"sections":[{"speaker":"narrator","purpose":"situation","voiceover":"Chín giờ tối, anh tắt thông báo ngân hàng, còn tin nhắn chủ trọ thì vẫn nằm đó. Nhưng thay vì trả lời, anh mở mạng, chụp cái ly cà phê nguội từ chiều, gõ hai chữ “vẫn ổn”. Vì sao lại nói ổn vào đúng lúc không ổn nhất? Anh lướt thấy một người bạn cũ vừa check-in Đà Lạt, một đồng nghiệp cũ vừa nhận bằng khen, rồi đăng tấm ảnh cái ly lên. Mệt thì vẫn còn, nhưng anh không nhìn vào nó nữa, anh nhìn vào màn hình. Rồi anh ngồi thêm nửa giờ chờ từng lượt thả tim, như thể chỉ cần đủ người tin thì mình cũng tin. Có người bình luận “trông ổn đấy”, anh thả tim lại, rồi màn hình tắt. Lúc đó anh mới thấy trống. Và câu hỏi nhỏ quay lại: nếu đã ổn thật, sao phải nói ra lúc này."},{"speaker":"narrator","purpose":"core_answer","voiceover":"Anh nói “vẫn ổn” không phải vì anh tin thế. Có thể vì người nhà đã đủ chuyện, công ty đang cần một người đứng vững, còn anh cần một bằng chứng cho chính mình rằng mọi thứ chưa tuột khỏi tay. Nhưng cái bằng chứng đó không làm việc nợ nhẹ đi; nó chỉ thêm một thứ để nhớ: tối qua mình khoe gì, mai phải giữ cho khớp. Thành ra cái mệt không nằm ở chuyện đăng hay không, mà nằm ở chỗ mỗi tấm ảnh là thêm một việc mình phải trông chừng."},{"speaker":"narrator","purpose":"evidence","voiceover":"Ngay sau khi đăng, tin nhắn từ một người chú gửi tới: “Thấy con ổn là chú mừng.” Anh đã định kể chuyện tiền nhà, nhưng ngón tay lại gõ “dạ con cảm ơn chú.” Lúc đó, bài đăng không còn là nơi anh kể gì nữa; nó thành một cánh cửa đóng lại trước khi người khác hỏi sâu. Cái giá nhỏ là anh vừa tự chặn đi một cơ hội để nói thật. Cái giá lớn hơn là người nhà sẽ càng tin rằng không cần hỏi thêm. Sau đó một ngày, chú gọi xuống nhà, khen anh chịu khó, rồi kể chuyện nhà chú cũng đang tính vay. Anh ngồi nghe mà thấy mình vừa mất một cơ hội để nói thật; lần sau mà anh mở lời, người ta sẽ ngạc nhiên, hoặc nghĩ anh đang đùa. Đó không phải lỗi của chú, mà là hệ quả của việc mình chỉ cho người khác thấy một mặt sáng lặp đi lặp lại. Mỗi lần như vậy, cánh cửa lại khép thêm một chút."},{"speaker":"narrator","purpose":"evidence","voiceover":"Sau tin nhắn của chú, anh mở lại bảng tin. Toàn thấy ảnh cưới, ảnh đi chơi, ảnh khen thưởng. Không ai đăng tấm ảnh lúc mình vừa gục xuống bàn. Còn anh thì biết tối qua mình đăng cái ly vì không muốn ai hỏi sâu. Nhìn vậy dễ tưởng mọi người đều ổn, trừ mình. Nhưng mỗi người chỉ đưa lên phần muốn người khác thấy, giống anh thôi."},{"speaker":"narrator","purpose":"evidence","voiceover":"Sáng hôm sau, thằng đồng nghiệp vỗ vai: “Tối qua trông mày ổn thế.” Anh cười, gật. Về bàn, anh mới thấy mình vừa nhận thêm một ca: phải giữ đúng cái dáng đó tới giờ tan. Buổi họp, câu “em đang quá tải” đã lên tới cổ, nhưng nhớ tấm ảnh tối qua nên anh nuốt lại. Người ta vừa thấy mình vui, giờ mình than khó thì kỳ. Chiều đó anh mệt gấp đôi, không phải vì thêm việc, mà vì phải canh cho trùng với người trong ảnh. Đến lúc về, anh tự hỏi: nếu hôm qua không đăng, liệu sáng nay mình có dám nói câu quá tải không?"},{"speaker":"narrator","purpose":"application","voiceover":"Trước khi nhấn đăng, anh thử mở ghi chú riêng và viết một dòng: “Mình đang né chuyện gì?” Nếu nhìn xuống thấy chữ “tiền nhà” hay “cuộc gọi của mẹ”, thì cái bài đăng lúc đó không phải nhu cầu kể chuyện, mà là cách lùi. Cái bước này không trả nợ, không dẹp được chuyện với vợ. Nó chỉ cho anh biết mình đang đứng chỗ nào. Nhiều hôm chỉ cần dừng vài giây, nhận ra “à mình lại định lấy điện thoại để trốn”, thì cơn thôi thúc đã giảm được một nửa. Không phải vì anh giỏi hơn, mà vì cái tay đang với lấy điện thoại vừa bị nhìn thấy."},{"speaker":"narrator","purpose":"application","voiceover":"Anh có thể chọn một người để nói thật một câu ngắn, thay vì đăng cho mấy trăm người. Không cần phải là người thân, có thể là một người bạn từng cùng cảnh. Câu mở đầu không cần khéo: “Dạo này tôi đang đuối, có hôm nào ngồi cà phê không?” Cái giá phải trả là anh không còn giữ được vẻ ngoài kín kẽ; người kia có thể không biết phản ứng thế nào. Có người sẽ gượng cười rồi đổi chủ đề, vì họ cũng đang gồng. Có người sẽ hỏi ngược lại: “Mày đang kẹt gì à?” Đó là lúc anh biết mình có thể nói tiếp hoặc dừng. Dấu hiệu cho thấy nó có ích không phải là người đó giải quyết giúp anh, mà là sau khi nói, vai anh có nhẹ hơn một chút hay không. Nếu không, đừng ép mình phải mở thêm với người chưa đủ an toàn."},{"speaker":"narrator","purpose":"application","voiceover":"Có hôm anh chưa muốn nói với ai. Tối đó, thay vì mở mạng, anh chọn đúng một việc đang né và ngồi với nó mười lăm phút: đọc lại tin nhắn chủ trọ, ghi con số đang nợ, hay soạn sẵn một câu trả lời chưa cần gửi. Không cần xong. Cái giá là mười lăm phút đó có thể làm anh thấy nặng hơn lúc đầu, vì mình vừa chạm vào thứ muốn trốn. Nhưng bù lại, cơn muốn khoe “vẫn ổn” thường dịu xuống, vì tay đã bận vào việc thật. Nó không trả hết nợ, không làm vợ hết lo, cũng không giúp sếp dễ chịu. Nó chỉ cắt cái vòng: càng mệt càng đăng, càng đăng càng thấy trống."},{"speaker":"narrator","purpose":"evidence","voiceover":"Anh thử nhớ lại tuần vừa rồi: có bài đăng nào của người khác mà giờ anh vẫn còn nhớ không? Phần lớn mình lướt, thả tim, rồi quên. Người thật sự quan tâm thường không đánh giá anh qua tấm ảnh tối qua; họ để ý anh còn trả lời tin nhắn không, còn ngồi ăn cơm với nhà không, còn đi làm không. Cho nên nếu tối nay anh không đăng gì, cũng chẳng ai thấy lạ. Cái người ta nhớ là anh có nhấc máy khi mẹ gọi, có xuống bếp khi con cần hay không. Còn việc khó thì vẫn ở đó, nhưng ngồi yên với nó một lúc có thể làm nó bớt đáng sợ hơn."},{"speaker":"narrator","purpose":"evidence","voiceover":"Trong điện thoại còn tấm hình ba năm trước, hồi anh nghĩ tới giờ này mình đã có nhà, có xe, có khoản để dành. Bây giờ mở ra thấy chưa tới, nên mỗi lần đăng “vẫn ổn” cũng là cách che đi cảm giác mình đang chậm. Nhưng tấm ảnh không trả lời được vì sao mình chậm. Có thể vì lương trả thấp, có thể vì một lần chọn sai, có thể vì còn gánh cho người khác. Nó chỉ đẩy câu hỏi ấy sang một đêm khác, thường là khi không có ai nhìn, và lúc đó nó quay lại to hơn."},{"speaker":"narrator","purpose":"application","voiceover":"Một ranh giới có thể giúp: không mở mạng xã hội trong mười lăm phút đầu sau khi tan làm, vì đó là lúc anh mệt và dễ lấy điện thoại để trốn. Thay vào đó, ngồi xuống, uống một ngụm nước, và kể ra giấy ba việc đang chiếm chỗ trong đầu, không cần sắp xếp. Cái giá là anh phải chịu ngồi với sự bực bội vài phút, thay vì có ngay một cái thả tim để dễ chịu. Nhưng đây cũng là lúc anh phân biệt được đâu là việc cần làm, đâu chỉ là tiếng ồn. Chỉ cần một lần không mở vội, anh sẽ thấy mình không bỏ lỡ gì quan trọng; thứ thật sự cần anh vẫn đang chờ ở bàn làm việc chứ không phải trên bảng tin."},{"speaker":"narrator","purpose":"payoff","voiceover":"Hãy thử tối nay, trước khi mở mạng xã hội, mở ghi chú và viết đúng một việc anh đang tránh. Rồi hãy đóng ứng dụng lại và xử lý việc đó trong mười lăm phút, hoặc ít nhất là đọc lại tin nhắn đang chờ. Không cần giải quyết xong, không cần đăng gì để chứng minh. Sau đó để ý xem cơn thôi thúc muốn khoe “vẫn ổn” có giảm đi không. Nếu nó giảm, anh vừa tìm được một lối ra nhỏ ngay trong đêm. Còn nếu nó chưa giảm, cũng không sao; đó là tín hiệu cho thấy thứ anh đang cần có thể không phải là một tấm ảnh, mà là một cuộc nói chuyện thật với người đủ an toàn."}],"machine":{"source":"editorial_review_cache","passed":true,"overall_score":9,"dimension_scores":{"causal_coherence":9,"human_truth":9,"role_fidelity":9,"spoken_naturalness":9,"useful_restraint":9},"violated_rules":[],"blocking_findings":[]}},{"id":"40cd37c07fc90b62","title":"Cuộc Gọi Bận Lúc Bảy Giờ Mười","profile":"ban-so-6","videoType":"long","sectionCount":16,"totalChars":5433,"sections":[{"speaker":"narrator","purpose":"situation","voiceover":"Bảy giờ mười phút. Bàn số sáu đã có người ngồi trước khi quán kịp ồn. Minh ngồi bên phía cửa kính, lưng quay ra quầy, tay trái đặt lên mặt bàn như giữ chỗ cho một cuộc gọi chưa bắt đầu. Cái điện thoại nằm úp trước mặt, còn cà phê thì chưa ai gọi. Việc còn lại của cậu là một số máy bên kho. Nếu không có người nhấc máy trước tám giờ, dòng xác minh tuyến giao hàng cậu giữ lại trong cuộc họp hôm qua sẽ chỉ còn là một câu nói không con số. Cậu đã nêu rủi ro đó trước mọi người, và câu hỏi vì sao tối qua không nói sớm vẫn còn treo ở hành lang. Giờ cậu chỉ có chừng năm mươi phút để biến nó thành điều có thể kiểm tra. Cậu không về nhà ngay. Cậu rẽ vào quán, ngồi xuống chỗ sáng hơn, nơi cậu thấy được cả cánh cửa lẫn đồng hồ. Cánh cửa kính còn đọng hơi nước. Bên ngoài, một chiếc xe máy chạy chậm qua, đèn pha còn bật. Minh nhìn theo, rồi cúi xuống nhìn mặt bàn. Vệt xước ở góc phải bàn số sáu vẫn còn, nhỏ và quen. Cậu đặt ngón tay lên đó một lúc, rồi rút tay về. Cuộc gọi đầu tiên vẫn chưa bắt đầu."},{"speaker":"an","purpose":"situation","voiceover":"Cà phê chưa gọi mà tôi mang ra rồi. Hôm nay cậu ngồi bên này, không phải chỗ quen mọi hôm. Cậu cần tôi để yên cho làm việc không?"},{"speaker":"minh","purpose":"situation","voiceover":"Bên này sáng hơn. Em còn một cuộc gọi phải xong trước tám giờ. Ngồi đây em thấy được cả cánh cửa lẫn cái đồng hồ, đỡ phải quay người lại mỗi lần kiểm tra giờ. Cà phê để đấy, em uống sau."},{"speaker":"narrator","purpose":"evidence","voiceover":"Minh lật điện thoại, bấm số. Ba hồi chuông đổ, rồi đầu dây bên kia nhảy vào một tiếng bận ngắn, lặp lại ba lần như ai đó đang đặt ống nghe xuống rồi nhấc lên lần nữa. Cậu tắt loa ngoài, đặt máy xuống mặt bàn, cạnh tách cà phê vẫn còn nguyên. Hơi nóng từ cà phê bay lên rồi loãng dần. Minh không nhìn điện thoại. Cậu nhìn ra cửa, nơi bóng người đi bộ lướt qua từng đợt. Lần gọi này chưa đem lại gì, nhưng nó đã làm một việc: kim đồng hồ không còn đứng yên."},{"speaker":"minh","purpose":"evidence","voiceover":"Máy bận."},{"speaker":"narrator","purpose":"situation","voiceover":"Bảy giờ mười lăm. Minh kéo tách cà phê lại gần, uống một ngụm nhỏ. Điện thoại rung một lần trên mặt bàn. Màn hình sáng tên vợ, kèm một dòng ngắn: 'Mấy giờ anh về? Con hỏi ba từ sáng.' Minh đọc xong, ngón cái chạm vào màn hình rồi để nguyên, không gõ chữ nào. Cậu úp máy xuống, đẩy sang mép trái bàn. Ở quầy, An đang kiểm tra cà phê phin, dùng muỗng gõ nhẹ vào thành bình. Một người khách đẩy cửa vào, gọi một ly đen mang đi. Tiếng máy xay ngắn lên rồi tắt. Minh không quay lại quầy. Cậu nhìn chiếc điện thoại, ngón tay gõ nhẹ lên mặt bàn, không theo nhịp nào. Khi người khách cầm ly bước ra, chuông cửa khẽ rung. Minh vẫn ngồi nguyên, tách cà phê đã vơi một phần ba, tin nhắn vẫn chưa trả lời."},{"speaker":"narrator","purpose":"evidence","voiceover":"Bảy giờ mười tám. Minh không gọi lại ngay. Cậu mở lại tin nhắn, gõ được mấy chữ rồi xóa, gõ lại rồi xóa nốt. Không phải vì thiếu câu, mà vì bất kỳ câu trả lời nào cũng phải kèm theo một con số bên kho chưa xác nhận. Cậu tắt khung soạn, đặt máy ngửa, nhìn đồng hồ. Ở quầy, An xếp lại mấy chiếc ly giấy, mở một hộp đường mới. Tiếng muỗng chạm vào thành hộp nhỏ mà rõ. Minh đặt lòng bàn tay lên mặt bàn, dùng ngón cái miết nhẹ vệt xước ở góc phải. Cái vệt quen này lần nào cũng ở đúng chỗ ấy. Cậu rút tay về, không ai khác trong quán để ý. Cậu đẩy tách cà phê ra mép bàn rồi kéo lại, không còn vì cà phê, mà vì tay cần một việc để khỏi cầm máy lên gọi ngay. Nhưng nếu không gọi sớm, tám giờ sẽ qua nhanh."},{"speaker":"an","purpose":"evidence","voiceover":"Cậu đừng nhìn đồng hồ nữa. Còn hơn nửa tiếng, nó không chạy nhanh hơn đâu. Tôi thấy cậu nhìn bốn lần từ lúc cúp máy rồi."},{"speaker":"narrator","purpose":"evidence","voiceover":"Bảy giờ hai mươi hai. Minh cầm điện thoại lên lần thứ hai. Lần này cậu để máy trước mặt, bật loa ngoài, nghe rõ bốn hồi chuông dài rồi lại tiếng bận đứt quãng, như đường dây bị ngắt giữa chừng. Minh đợi thêm vài giây, nhưng đầu bên kia không có người. Cậu chạm vào màn hình cho âm thanh tắt, rồi để máy nằm ngửa. Tách cà phê đã nguội. Cửa quán mở rồi khép thêm một lần. An rời quầy, đi vòng ra phía bàn số sáu, tay vẫn cầm một chiếc khăn lau."},{"speaker":"minh","purpose":"evidence","voiceover":"Vẫn bận. Lần thứ hai."},{"speaker":"an","purpose":"core_answer","voiceover":"Cậu định gọi lại lần nữa, hay để lát nữa?"},{"speaker":"minh","purpose":"core_answer","voiceover":"Gọi nữa cũng gặp tiếng bận thôi. Em không về ngay được. Vợ em nhắn hỏi mấy giờ về, con hỏi ba từ sáng. Em chưa biết trả lời sao nếu bên kho chưa xác nhận. Nên em ghi yêu cầu ra, gửi tin cho họ. Ai rảnh bên đó thấy sẽ trả lời. Còn nếu tám giờ chưa ai phản hồi, em gọi lại lần nữa rồi mới về. Chứ giờ cứ gọi mãi cũng không ra thêm gì."},{"speaker":"narrator","purpose":"application","voiceover":"Minh mở ghi chú trên điện thoại, gõ từng dòng ngắn. Cậu viết chậm, dừng lại giữa chừng để đọc lại rồi xóa một chữ, gõ lại chữ khác. Bàn tay rời màn hình một lần, rồi lại đặt xuống. Cuối cùng cậu bấm gửi. Điện thoại hiện lên một dòng nhỏ rồi tắt. Minh đặt máy úp trở lại, nhưng không đẩy sang mép bàn như lúc nãy. Cậu để nó ngay trước mặt, màn hình sáng lên một lần rồi tối dần. Tách cà phê cạn đến đáy. An đứng cách đó một bước, không nói gì."},{"speaker":"minh","purpose":"evidence","voiceover":"Gửi rồi. Em vẫn để máy ngay trước mặt, không cất vào túi. Lúc nãy em nghĩ bấm gửi xong là về nhà được, nhưng giờ lại ngồi canh màn hình. Đi xe về mà điện thoại rung giữa đường, em cũng phải tấp vô lề để xem. Thôi ngồi đây thêm mười phút. Lỡ bên kho trả lời sớm, em còn biết đường trả lời vợ."},{"speaker":"an","purpose":"evidence","voiceover":"Sáng nay tôi cũng gọi bên cung cấp đá. Hai lần bận. Tôi gửi tin, xong đi pha cà phê cho người khác. Tới giờ cũng chưa thấy trả lời. Chắc họ đang dỡ hàng."},{"speaker":"narrator","purpose":"payoff","voiceover":"Bạn có thể làm đúng một việc, gửi tin nhắn đi, rồi vẫn ngồi lại với màn hình chưa sáng. Làm xong không có nghĩa là nhẹ ngay, vì cái giá có thể đến trước, phần được còn nằm ở phía sau. Có lẽ bạn cũng từng chờ một hồi âm mà quên cả việc mình vừa làm xong, chỉ vì màn hình chưa sáng lên lần nào. Tập sau, khi người bên kho gọi lại hoặc khi câu hỏi vì sao tối qua không nói sớm quay về, câu chuyện này mới có đoạn tiếp theo."}],"machine":{"source":"editorial_review_cache","passed":true,"overall_score":9,"dimension_scores":{"causal_coherence":9,"human_truth":9,"role_fidelity":9,"spoken_naturalness":9,"useful_restraint":9},"violated_rules":[],"blocking_findings":[]}},{"id":"78d33588ba023d31","title":"Năm Lần Đổ Chuông Trước Giờ Họp","profile":"ban-so-6","videoType":"short","sectionCount":11,"totalChars":1286,"sections":[{"speaker":"narrator","purpose":"situation","voiceover":"Sáu giờ bảy, Bàn số 6: gọi năm lần nhưng không ai nhấc."},{"speaker":"narrator","purpose":"core_answer","voiceover":"Nói thẳng việc chưa xác nhận và xin lùi một ngày. Minh chọn vậy sau năm cuộc gọi đổ chuông rồi im, thay vì để cuộc họp chốt trên con số chưa chắc."},{"speaker":"narrator","purpose":"evidence","voiceover":"Năm lần gọi đều đổ chuông rồi im. Sáu giờ bốn mươi, Minh vào họp, mở slide có dòng vàng cuối, nói mình chưa xác nhận được với bên vận chuyển."},{"speaker":"an","purpose":"evidence","voiceover":"Bên vận chuyển vẫn chưa ai nhấc máy hả? Tôi thấy cậu gọi mấy lần rồi lại đặt điện thoại xuống."},{"speaker":"minh","purpose":"evidence","voiceover":"Chưa. Năm lần đều đổ chuông rồi im, nên vào họp em nói chưa xác nhận được và xin lùi một ngày."},{"speaker":"an","purpose":"application","voiceover":"Người ta có đồng ý lùi không, hay vẫn bắt chốt theo kế hoạch cũ? Mặt cậu từ nãy không giống kết quả êm."},{"speaker":"minh","purpose":"evidence","voiceover":"Không duyệt. Khang đã có số trước, còn em chỉ nói được là chưa chắc. Họ chốt luôn và hỏi sao tối qua không nói sớm."},{"speaker":"an","purpose":"application","voiceover":"Câu đó cậu trả lời sao? Tối qua cậu có số chưa, hay cũng chờ bên vận chuyển như sáng nay?"},{"speaker":"minh","purpose":"evidence","voiceover":"Em cũng chờ từ tối qua. Nên câu đó em chưa trả lời được, cũng không biết vì sao mình không nói sớm hơn."},{"speaker":"an","purpose":"application","voiceover":"Cậu có muốn trả lời câu đó cho chính mình không, hay để nó yên một lúc?"},{"speaker":"narrator","purpose":"payoff","voiceover":"Có lẽ bạn cũng từng nói thật rồi nhận về một kế hoạch không được duyệt, và tự hỏi mình vừa làm điều đúng hay chỉ khiến mọi việc chậm hơn. Cái còn lại không phải câu trả lời, mà là câu hỏi vẫn chưa có người nhấc máy. Hẹn gặp lại ở tập sau trong video dài Dòng Vàng Cuối Slide."}],"machine":{"source":"editorial_review_cache","passed":true,"overall_score":9,"dimension_scores":{"causal_coherence":10,"human_truth":9,"role_fidelity":9,"spoken_naturalness":9,"useful_restraint":9},"violated_rules":[],"blocking_findings":[]}},{"id":"a365b498910980ef","title":"Vì Sao Tối Qua Không Nói Sớm?","profile":"ban-so-6","videoType":"short","sectionCount":11,"totalChars":1323,"sections":[{"speaker":"narrator","purpose":"situation","voiceover":"Sáu giờ, bàn sáu, nhưng dòng vàng cuối slide chưa xác nhận"},{"speaker":"narrator","purpose":"core_answer","voiceover":"Nói đúng điều chưa xác nhận trước khi vào họp, còn hơn để người khác tự hỏi vì sao tối qua mình không nói sớm."},{"speaker":"narrator","purpose":"evidence","voiceover":"Minh kéo con trỏ xuống dòng cuối được tô vàng, nơi ngày hàng về kho vẫn chưa có ai xác nhận."},{"speaker":"an","purpose":"application","voiceover":"Cậu gọi bên vận chuyển chưa? Sáng nay tôi thấy cậu ra cửa kính cầm điện thoại lâu lắm."},{"speaker":"minh","purpose":"application","voiceover":"Chưa ai nhấc máy. Em gọi năm lần, lần nào cũng đổ chuông rồi im. Giờ em không thể nói con số đó đã được xác nhận, nên em sẽ vào họp và nói thẳng là chưa chốt được."},{"speaker":"an","purpose":"application","voiceover":"Vậy cậu định vào họp nói chưa chốt à? Rồi nếu có người hỏi sao tối qua không nói luôn, cậu trả lời sao?"},{"speaker":"minh","purpose":"application","voiceover":"Ừ, lùi một ngày. Em biết mình sẽ bị xem là chậm hơn mấy đứa trẻ, nhưng nếu em im rồi kế hoạch giao sai ngày, cái giá còn nặng hơn."},{"speaker":"narrator","purpose":"evidence","voiceover":"Tám giờ, cuộc họp. Minh nói thẳng dòng vàng chưa xác nhận và đề nghị lùi một ngày. Kế hoạch không được duyệt."},{"speaker":"an","purpose":"application","voiceover":"Vậy kết quả thế nào? Tôi thấy cậu quay lại sớm hơn mọi khi, không cầm theo túi xách."},{"speaker":"minh","purpose":"application","voiceover":"Không được duyệt. Duy hỏi em sao tối qua không nói sớm. Em không trả lời được, vì tối qua em gọi bên vận chuyển, người ta hứa sáng nay chốt, nên em im."},{"speaker":"narrator","purpose":"payoff","voiceover":"Bạn có thể đã nói thật ở phút cuối rồi nhận lại câu hỏi mà bạn chưa trả lời được. Có lẽ điều còn lại không phải đúng sai, mà là câu hỏi đó vẫn còn ở lại. Lần tới, video dài minh-cham-hon-dong-nghiep-tre sẽ đi tiếp từ chỗ chưa kịp nói đó."}],"machine":{"source":"editorial_review_cache","passed":true,"overall_score":9,"dimension_scores":{"causal_coherence":9,"human_truth":9,"role_fidelity":9,"spoken_naturalness":9,"useful_restraint":9},"violated_rules":[],"blocking_findings":[]}},{"id":"d83634f0c432297a","title":"Làm Đúng Rồi Vẫn Nặng","profile":"ban-so-6","videoType":"long","sectionCount":20,"totalChars":6210,"sections":[{"speaker":"narrator","purpose":"situation","voiceover":"Tám giờ mười hai phút sáng. Minh ngồi ở bàn trong cùng quán Bàn số 6, không phải bàn số 6 cạnh cửa kính cậu vẫn ngồi mỗi sáu giờ. Ly cà phê An rót từ lúc cậu bước vào đã nguội nguyên, lớp váng mỏng se lại trên mặt. Laptop đóng, điện thoại úp xuống. Cuộc họp sáng nay kết thúc lúc tám giờ, và lời cảnh báo cậu nêu về tuyến giao hàng vẫn chưa ai gọi xác nhận. Nếu tới mười giờ vẫn chưa có phản hồi, kế hoạch cuối tuần có thể chốt trên một thông tin chưa chắc, còn Minh sẽ là người biết mà không làm tới cùng. Cậu vừa làm một việc đúng, nhưng việc đó chưa xong. Ngoài cửa kính, xe buýt rời trạm. Minh chạm ngón tay vào cạnh điện thoại rồi rút lại, không nhấc máy. Cậu cũng không ra chỗ quen. Có lẽ vì ở bàn trong cùng này, nếu cuộc gọi không tới, cậu còn không phải ngồi nhìn đúng chỗ mọi người vẫn thấy cậu lúc sáu giờ."},{"speaker":"an","purpose":"situation","voiceover":"Hôm nay cậu không ngồi bàn số 6. Tôi nhìn ra chỗ đó từ lúc mở quán, cứ nghĩ cậu chưa tới. Hoá ra cậu vào rồi, ngồi tận trong cùng. Cậu vào từ lúc nào mà tôi không thấy?"},{"speaker":"minh","purpose":"core_answer","voiceover":"Ừ, em ngồi đây cho gần ổ cắm. Laptop sắp hết pin, mà em cũng không định mở máy ngay. Chỗ này khuất, ngồi tạm cũng được. Em vào lúc chị đang quay lưng pha cà phê cho khách."},{"speaker":"an","purpose":"evidence","voiceover":"Cà phê nguội rồi. Cậu chưa uống ngụm nào. Hôm nay cậu gọi cà phê đen không đường, tôi nhớ rõ, nhưng ly vẫn đầy. Thường cậu uống một hơi rồi mới mở máy. Hôm nay khác thật. Tôi đã tính cầm ly đi hâm lại, nhưng thấy cậu ngồi im quá nên thôi."},{"speaker":"minh","purpose":"application","voiceover":"Em quên mất. Lúc nãy còn đang nghĩ chuyện khác, ly cà phê cứ để đấy. Để em uống tạm. Cũng không nguội hẳn, vẫn còn ấm dưới đáy. Mà nguội cũng được, em quen uống nguội rồi."},{"speaker":"narrator","purpose":"evidence","voiceover":"An bưng khay đi qua, dừng lại lau mép bàn trống cạnh bàn Minh. Minh cầm ly cà phê lên, uống một ngụm, rồi đặt xuống chậm hơn mức cần. Vị đắng nguội làm cậu nhăn mặt, nhưng cậu không nói. Cậu mở nắp laptop, để màn hình sáng lên ở trang soạn thảo còn trống, rồi đóng xuống gần như ngay lập tức. Điện thoại vẫn úp. Không có tin nhắn. Tiếng máy xay ở quầy vang lên, một khách mới gọi cà phê mang đi; quán không còn yên như lúc nãy. Minh nhìn ra bàn số 6, nơi ánh sáng đã bò qua vết xước ở góc phải, rồi quay lại nhìn bàn tay mình. An liếc thấy cậu nhăn mặt, nhưng không hỏi, vì cô còn đang làm xong ly cho khách mới."},{"speaker":"an","purpose":"situation","voiceover":"Cậu lật điện thoại lên rồi lại úp xuống mấy lần. Có tin gì đang chờ à? Màn hình cậu cứ sáng lên rồi tắt, tôi đứng quầy nhìn cũng thấy."},{"speaker":"minh","purpose":"core_answer","voiceover":"Có lẽ. Em tưởng họ gọi sớm. Thực ra em cũng không biết mình đang chờ cái gì trước, một cuộc gọi hay một câu nhắn. Chỉ là cứ thấy điện thoại yên lặng là em lại lật lên. Chắc do em sốt ruột. Em không quen ngồi yên khi chưa xong việc."},{"speaker":"an","purpose":"evidence","voiceover":"Họ là ai mà cậu chờ từ lúc ngồi xuống?"},{"speaker":"minh","purpose":"core_answer","voiceover":"Bên vận chuyển. Trong cuộc họp sáng nay em nói một việc chưa ai xác nhận, là tuyến giao hàng hôm qua về kho không đúng giờ. Họ bảo sẽ kiểm tra rồi gọi lại. Em tưởng nói xong thì việc sẽ chạy, nhưng giờ vẫn ngồi đây, không biết họ đã nhận việc chưa. Em nói ra vì nếu để kế hoạch chốt nhầm, cuối tuần này hàng về chậm thì cả đội phải gánh. Nhưng nói rồi mới thấy mình đứng giữa, chờ người khác xác nhận."},{"speaker":"narrator","purpose":"evidence","voiceover":"Từ quầy, An đặt thêm một ly nước lọc lên bàn cạnh ly cà phê vẫn đầy. Minh cảm ơn bằng một cái gật, rồi lại nhìn điện thoại. Nhưng lần này cậu không lật nó. Cậu cầm lấy tờ giấy ăn ở góc bàn, gấp làm tư, vuốt mép, rồi đặt xuống dưới đế ly nước cho khỏi đọng vòng nước. Một việc nhỏ không liên quan tới cuộc gọi đang chờ. An đứng lại một giây, thấy vòng nước chưa kịp lan ra. Cô không nói gì. Ngoài đường, tiếng xe buýt rẽ vào trạm lại vang lên. Bàn số 6 vẫn trống, vết xước góc phải sáng rõ trong nắng. An xếp thêm mấy tờ giấy ăn vào hộp đựng ở quầy, rồi mới quay lại bàn Minh."},{"speaker":"an","purpose":"application","voiceover":"Cậu cứ lật điện thoại lên rồi úp xuống suốt từ lúc ngồi. Họ có nói khi nào gọi lại không?"},{"speaker":"minh","purpose":"core_answer","voiceover":"Không nói giờ. Em tưởng nói ra xong thì việc sẽ chạy. Ai ngờ còn phải chờ người ta xác nhận, xong mình lại phải quay lại hỏi từng đầu việc. Nói đúng ra, sau khi nói, em thấy việc cần làm còn nhiều hơn lúc chưa nói. Đáng lẽ em phải thấy nhẹ, nhưng không. Em cũng không biết. Em chỉ thấy ngồi đây mỗi phút trôi qua là mỗi phút việc chưa xong."},{"speaker":"an","purpose":"evidence","voiceover":"Laptop cậu vẫn đóng, ly cà phê vẫn đầy, tôi chưa thấy cậu mở máy lần nào. Cậu định làm gì trong lúc chờ vậy?"},{"speaker":"narrator","purpose":"application","voiceover":"Minh đẩy ghế ra, đứng lên một nửa rồi lại ngồi xuống. Cậu cắm sạc vào laptop, đèn báo pin nhấp nháy màu cam. Rồi cậu mở máy, để màn hình sáng trước mặt, con trỏ nhấp nháy trong một tài liệu trống. An quay lại, thấy cậu đã mở máy nhưng tay vẫn để cách bàn phím một khoảng. Cô đặt xuống cạnh cậu một miếng giấy ăn, không nói. Minh nhìn màn hình như thể đang chờ nó gợi cho cậu việc cần làm tiếp theo. Cậu gõ thử ba phím, chữ hiện ra rồi xóa mất. Màn hình trở về trống. Điện thoại vẫn úp, nhưng cậu không lật nó nữa."},{"speaker":"minh","purpose":"core_answer","voiceover":"Em chưa biết mở ra thì làm gì. Cứ mở ra lại thấy thêm việc. Thôi để em chờ bên vận chuyển gọi trước đã. Chị cho em ngồi thêm chút."},{"speaker":"an","purpose":"evidence","voiceover":"Cậu có thể ngồi bàn số 6 nếu muốn. Bàn đó vẫn trống. Tôi để cà phê bên đó, cậu thích thì ra. Còn không thì tôi lấy ly này đi pha lại. Cậu muốn tôi pha lại ly khác không?"},{"speaker":"narrator","purpose":"application","voiceover":"An xếp lại mấy cái tách ở quầy, mắt liếc sang Minh. Cậu vẫn ngồi yên, tay đặt trên nắp laptop, còn điện thoại nằm cách đó một gang. Cậu không chạm vào nó. Một người khách mang cà phê ra về, tiếng chuông cửa rung lên rồi im hẳn. Minh đưa tay về phía điện thoại, dừng lại ở mép bàn, rồi nhấc lên. Cậu không lật úp, không bấm gì. An không đến gần, chỉ đặt khăn xuống quầy. Cả hai cùng nghe tiếng quạt trần quay đều. An nhìn tay cậu đặt trên điện thoại, rồi nhìn ra bàn số 6. Cô mở miệng như muốn hỏi lại thôi, vì tiếng chuông cửa vừa im."},{"speaker":"minh","purpose":"core_answer","voiceover":"Chờ mãi không biết họ đã nhận việc chưa. Để em gọi luôn. Họ bận thì em biết phải chờ thêm, mà nếu họ chưa kiểm tra thì em cũng biết mình đã làm hết phần của mình. Còn hơn ngồi đây đoán."},{"speaker":"narrator","purpose":"payoff","voiceover":"Cậu bấm số. Hồi chuông thứ nhất chưa đổ tới lần thứ hai, đầu dây chuyển sang tín hiệu bận. Cậu tắt máy, đặt điện thoại xuống bàn. Ly cà phê vẫn nguội, nhưng cậu không nhìn nó. Bên ngoài, xe buýt rời trạm lần thứ hai, nhưng cậu không ngước lên. Có lẽ bạn cũng từng làm đúng một việc khó rồi nhận lại chỉ một hồi chuông bận, không phải câu trả lời. Việc vừa chọn không giúp mọi thứ nhẹ đi ngay; nó chỉ biến khoảng chờ im lặng thành một việc đã được gửi đi. Tập sau, cuộc gọi xác nhận bên vận chuyển vẫn chưa có kết quả, và câu hỏi vì sao tối qua không nói sớm vẫn còn ở hành lang công ty."}],"machine":{"source":"editorial_review_cache","passed":true,"overall_score":9,"dimension_scores":{"causal_coherence":9,"human_truth":9,"role_fidelity":10,"spoken_naturalness":9,"useful_restraint":9},"violated_rules":[],"blocking_findings":[]}},{"id":"f0797425712e6f18","title":"Dòng Vàng Cuối Slide","profile":"ban-so-6","videoType":"long","sectionCount":20,"totalChars":6047,"sections":[{"speaker":"narrator","purpose":"situation","voiceover":"Sáu giờ mười hai phút ở Bàn số 6, Minh ngồi bên cửa kính từ lúc quán mở, nhưng tách cà phê trước mặt đã nguội. Cuộc họp lúc chín giờ còn một slide chưa chốt, và ở cuối trang vẫn còn dòng cảnh báo về tuyến giao hàng chưa ai xác nhận. Cậu có thể giữ nó và bị hỏi, hoặc xóa nó và để kế hoạch đi tiếp trong im lặng. Cậu mở lại trang đó lần thứ ba, con trỏ chớp ngay đầu dòng, còn bàn tay thì không nhấn thêm phím nào."},{"speaker":"an","purpose":"situation","voiceover":"Tách cà phê nguội rồi mà cậu chưa uống một ngụm nào. Tôi thấy từ lúc mở quán cậu cứ ngồi nhìn màn hình, kéo lên rồi lại kéo xuống, mấy lần muốn gõ gì đó lại thôi. Sáng nay cậu có hẹn gấp à, hay là cái màn hình đó có gì làm cậu ngồi không yên? Cà phê để vậy mất vị, nhưng nhìn cậu thì có lẽ cà phê không phải thứ đáng lo nhất."},{"speaker":"minh","purpose":"core_answer","voiceover":"Em có cuộc họp lúc chín giờ. Tối qua em làm tới hơn mười một giờ, xong vẫn chưa dám chốt cái slide cuối. Sáng nay ngồi xem lại, thấy có một dòng chưa chắc chắn, nên em cứ kéo lên kéo xuống mãi. Cà phê em quên uống thật, tại em vừa mở máy là nghĩ đến giờ họp. Em không cố ý để chị dọn, mà em cứ thấy chưa xong."},{"speaker":"narrator","purpose":"evidence","voiceover":"Minh kéo con trỏ xuống dòng cuối cùng. Dòng đó được tô vàng, ghi ngày hàng về kho chưa có ai xác nhận. Cậu xóa đi, rồi gõ lại đúng ba từ vừa xóa. Bàn tay đặt trên bàn phím lâu hơn bình thường, ngón trỏ chưa bấm lưu. Ngoài cửa kính, đèn đỏ chuyển sang xanh ở ngã tư đầu phố, rồi một chiếc xe tải chạy qua, bụi mỏng bay ngang mặt kính."},{"speaker":"an","purpose":"situation","voiceover":"Cái dòng màu vàng cậu cứ kéo lên kéo xuống đó, nó là gì vậy? Tôi thấy cậu xóa rồi gõ lại, như kiểu không quyết được để nó nằm yên ở đâu. Cà phê tôi có thể hâm lại, chứ cái dòng đó chắc không tự yên được đâu. Nếu nó khó nói thì cậu cứ nói một nửa, tôi chỉ cần biết cậu có đang vướng ở đâu không."},{"speaker":"minh","purpose":"core_answer","voiceover":"Là dòng cảnh báo lịch hàng về kho bên vận chuyển. Nếu em giữ nó, cuộc họp sẽ hỏi số liệu; nếu em xóa, kế hoạch cứ chạy đúng nhưng em biết nó chưa chắc. Em ngồi đây vì chưa muốn chọn bên nào. Em không muốn mọi người nhìn em như người chưa chuẩn bị xong, nhưng cũng không muốn làm cả phòng dừng lại vì một dòng em chưa kiểm tra."},{"speaker":"an","purpose":"evidence","voiceover":"Vậy số liệu cho dòng đó bây giờ cậu có chưa? Tôi thấy cậu xoá rồi gõ lại đúng chỗ đó mấy lần, chứ không nhấn sang chỗ khác. Cậu đang đợi cái gì ở dòng đó?"},{"speaker":"minh","purpose":"evidence","voiceover":"Em chưa có. Tối qua em gọi bên vận chuyển mà không ai bắt máy. Bây giờ em có thể gọi lại, nhưng sợ họ chưa làm việc, xong mình lại nghe như đang thúc giục. Em chần chừ vì em không muốn mang một con số chưa chắc vào phòng họp. Rồi em cứ nghĩ thêm mấy chuyện nhỏ: họ có nghĩ em không biết sắp xếp không, có làm khó đồng nghiệp không."},{"speaker":"narrator","purpose":"situation","voiceover":"Điện thoại của Minh rung lần thứ hai. Lịch nhắc họp lúc chín giờ, còn slide vẫn là phiên bản sáu. Phía trên hộp thư, một tệp mới của cậu đồng nghiệp trẻ tên Khang gửi lúc mười một giờ đêm qua, đã sửa xong phần của mình. Minh nhìn tên tệp đó rồi quay lại dòng vàng. Kim đồng hồ chỉ sáu giờ ba mươi chín phút. Cửa quán vẫn mở, gió sớm lùa vào mang theo tiếng xe."},{"speaker":"an","purpose":"application","voiceover":"Tôi không biết bên vận chuyển có bắt máy không. Nhưng cậu ngồi đây nhìn cái dòng đó thêm nửa tiếng, nó cũng không tự có số liệu. Tôi có thể để yên cho cậu gọi, vì giờ này quán vẫn vắng. Tôi sẽ quay lại sau vài phút. Cậu cứ ngồi thêm chút, đừng để cà phê làm cậu phân tâm."},{"speaker":"minh","purpose":"situation","voiceover":"Em không muốn gọi vào giờ này. Bên vận chuyển thường đến hơn tám giờ mới trực tổng đài. Em cũng không biết phải hỏi thế nào cho khỏi bị hiểu là đang hối. Em sợ gọi xong lại nhận được một câu trả lời nửa vời, rồi vẫn phải vào họp với câu chuyện cũ. Mà nếu người ta nói chưa rõ, em lại càng khó mở miệng trong phòng họp."},{"speaker":"an","purpose":"core_answer","voiceover":"Vậy nếu bên đó chưa xác nhận, vào họp cậu định nói thế nào? Cậu chọn đợi thêm, hay là nói luôn là chưa gọi được? Tôi thấy cậu ngồi đây đã lâu, còn cà phê thì nguội từ lúc nào."},{"speaker":"narrator","purpose":"evidence","voiceover":"Minh cầm điện thoại lên. Cậu ấn số, màn hình sáng lên rồi tối đi. Cuộc gọi đổ chuông năm lần, không ai nhấc máy. Cậu để điện thoại xuống bàn, cạnh tách cà phê nguội, rồi nhìn đồng hồ. Bảy giờ kém mười lăm. Ngoài cửa, xe buýt chạy qua, bóng người lướt trên mặt kính, còn Minh vẫn ngồi yên."},{"speaker":"minh","purpose":"core_answer","voiceover":"Không ai bắt máy. Vậy em sẽ không chờ nữa. Trong cuộc họp, em sẽ nói rõ là tuyến giao hàng chưa được xác nhận, và đề nghị lùi lại một ngày để kiểm tra. Em chưa có số liệu, nhưng ít nhất em không để kế hoạch đi với một con số đoán. Em biết nói vậy sẽ chậm hơn người ta, nhưng mà im thì kế hoạch cũng không chạy đúng được."},{"speaker":"narrator","purpose":"situation","voiceover":"Tám giờ năm mươi phút, phòng họp bật đèn. Khang trình bày nhanh, chuột chạy qua từng slide không nghỉ. Minh ngồi cuối bàn, mở phiên bản sáu của mình. Cậu thấy mình chậm hơn hẳn khi mọi người đã chuyển sang phần tiếp theo. Dòng vàng vẫn nằm chờ ở cuối trang. Cậu hít một hơi trước khi tới lượt mình."},{"speaker":"minh","purpose":"application","voiceover":"Phần của em còn một điểm chưa chốt. Bên vận chuyển chưa xác nhận ngày hàng về kho, nên nếu mình chốt kế hoạch hôm nay thì số liệu này chưa chắc. Em đề nghị lùi một ngày để gọi lại và kiểm tra đúng tuyến. Em xin lỗi vì chưa có số liệu ngay, nhưng em nghĩ chờ một ngày còn hơn sửa lại cả chuỗi giao hàng sau đó."},{"speaker":"narrator","purpose":"evidence","voiceover":"Minh nói xong, phòng im lại. Một giọng hỏi vì sao tối qua không gọi luôn. Khang dừng chuột, quay lại nhìn Minh. Cậu không thấy ai giận, nhưng cũng không ai gật đầu ngay. Tiến độ hiện ra giữa màn hình, lệch sang phải vì thêm một ngày chờ. Câu hỏi vẫn chưa tan, còn Minh thì nhìn xuống bàn phím. Không khí trong phòng chùng xuống."},{"speaker":"minh","purpose":"core_answer","voiceover":"Tối qua em có gọi, sáng nay em cũng gọi rồi, nhưng không ai bắt máy. Em chưa báo sớm vì em cứ chờ bên đó xác nhận trước, chứ em không muốn làm cả phòng dừng lại vì một phần chưa rõ. Bây giờ em thừa nhận là đáng lẽ em nên nói từ tối qua. Nhưng nếu lỡ số liệu sai, mình còn phải sửa nhiều hơn một ngày."},{"speaker":"narrator","purpose":"payoff","voiceover":"Cuộc họp kết thúc mà kế hoạch không được duyệt. Mọi người đồng ý lùi một ngày để xác minh. Minh trở về chỗ ngồi, cất laptop, nhưng vẫn mở điện thoại ra nhìn cuộc gọi nhỡ. Cậu chậm hơn Khang, nhưng hôm nay cái chậm đó khiến cả nhóm phải chờ thêm. Cậu chưa rõ điều nào đáng hơn. Cửa phòng đóng lại sau lưng cậu, đèn vẫn sáng."},{"speaker":"narrator","purpose":"payoff","voiceover":"Có lẽ bạn cũng từng giữ lại một điều chưa chắc vì chưa có con số nào đứng về phía mình. Hôm nay lựa chọn đó làm kế hoạch phải lùi thêm một ngày, còn câu hỏi vì sao không nói sớm vẫn chưa ai trả lời. Tập sau, cuộc gọi xác minh vẫn chưa hồi âm, và câu hỏi ấy vẫn còn để ngỏ."}],"machine":{"source":"editorial_review_cache","passed":true,"overall_score":9,"dimension_scores":{"causal_coherence":9,"human_truth":9,"role_fidelity":9,"spoken_naturalness":9,"useful_restraint":9},"violated_rules":[],"blocking_findings":[]}},{"id":"022fa2eac0694279","title":"Minh Định Tự Đoán, Rồi Dừng Lại Hỏi Một Câu","profile":"ban-so-6","videoType":"short","sectionCount":4,"totalChars":532,"sections":[{"speaker":"narrator","purpose":"situation","voiceover":"Sáu giờ hai mươi. Minh đang viết lại đoạn mở đầu lần thứ ba, cố đoán xem An cần bản tóm tắt dài hay ngắn."},{"speaker":"minh","purpose":"core_answer","voiceover":"Chị cần bản này gửi cho khách hàng hay chỉ để nội bộ xem ạ?"},{"speaker":"an","purpose":"application","voiceover":"Nội bộ thôi. Em viết ngắn gọn, chừng nửa trang là đủ. Câu hỏi ngắn của Minh không làm An mất thời gian, mà giúp cả hai tránh được một buổi sáng sửa lại bản nháp sai hướng. Rõ ràng ngay từ đầu luôn nhẹ hơn việc tự vẽ ra tiêu chuẩn rồi loay hoay đáp ứng nó."},{"speaker":"narrator","purpose":"payoff","voiceover":"Minh gõ lại tiêu đề và ba gạch đầu dòng. Khi không còn phải đoán, mười phút là đủ để xong một bản nháp dùng được."}],"machine":{"source":"script.quality_review.qa","passed":false,"overall_score":null,"dimension_scores":{},"violated_rules":["hook"],"blocking_findings":["Cảnh mở đầu chưa neo được khoảnh khắc hoặc chưa có gì để mất."]}},{"id":"022f1b7ad9b317bf","title":"Chi Phí Cơ Hội: Thứ Bạn Thật Sự Bỏ Lỡ Khi Chọn Một Điều","profile":"legacy-pre-profile","videoType":"long","sectionCount":10,"totalChars":6430,"sections":[{"speaker":"narrator","purpose":"situation","voiceover":"Mến chào các bạn, Chi Phí Cơ Hội: Thứ Bạn Thật Sự Bỏ Lỡ Khi Chọn Một Điều. Bạn đứng trước hai lựa chọn rất bình thường: nhận thêm một việc cuối tuần, hoặc giữ trọn hai ngày để nghỉ, gặp gia đình hay hoàn thành việc cá nhân. Khi nhận việc, ta thường chỉ nhìn thấy khoản tiền sẽ nhận. Nhưng thật ra, quyết định đó còn lấy đi một thứ không hiện trên hóa đơn: phương án tốt nhất mà bạn không thể chọn cùng lúc. Nếu chỉ nhìn số tiền bỏ ra hay tiền kiếm được, ta dễ gọi một lựa chọn là rẻ, hợp lý, thậm chí tiết kiệm, trong khi cái giá thật nằm ở nơi khác."},{"speaker":"narrator","purpose":"core_answer","voiceover":"Chi phí cơ hội là giá trị của phương án tốt nhất bạn đã từ bỏ để chọn phương án hiện tại. Nó không có nghĩa là phải tiếc mọi thứ mình không làm. Nó là một cách so sánh có kỷ luật giữa những phương án thật sự cạnh tranh cùng một nguồn lực: cùng một giờ buổi tối, cùng một khoản tiền trong tháng, cùng một sự tập trung, hoặc cùng một cơ hội hiếm. Bạn chọn học một khóa tối nay thì chi phí cơ hội không phải tất cả hoạt động khác trên đời. Nó là lựa chọn tốt nhất, khả thi nhất mà tối nay bạn đã không làm được: có thể là hoàn thành báo cáo đúng hạn, ngủ sớm để hồi phục, hoặc ở bên người thân đã hẹn trước."},{"speaker":"narrator","purpose":"evidence","voiceover":"Lý do khái niệm này dễ bị bỏ quên khá đơn giản: kết quả của thứ được chọn hiện ra ngay trước mắt, còn kết quả của thứ không chọn thì không xảy ra để ta quan sát. Bạn mua một món đồ, món đó nằm trong tay. Bạn nhận một cuộc hẹn, lịch đã có tên. Nhưng buổi tối yên tĩnh bạn đánh đổi, khoản tiền để dành, hay công việc quan trọng lùi lại đều là những khả năng không thành hiện thực. Trong kinh tế học, chi phí cơ hội được dùng để mô tả chính sự đánh đổi khi nguồn lực có hạn. Với đời sống cá nhân, nó không giúp đo mọi thứ bằng tiền; nó giúp ta nhớ rằng thời gian và sự chú ý cũng hữu hạn, nên một lựa chọn tốt cần được đặt cạnh lựa chọn thay thế tốt nhất."},{"speaker":"narrator","purpose":"evidence","voiceover":"Ví dụ thứ nhất là chiếc điện thoại đang giảm giá. Bạn có đủ tiền để mua và giá giảm thật, nên cảm giác tiết kiệm là có cơ sở. Nhưng câu hỏi về chi phí cơ hội không phải là: “Mình có trả được không?” Câu hỏi là: “Nếu không mua trong tháng này, phương án tốt nhất cho đúng khoản tiền đó là gì?” Có thể là quỹ dự phòng còn thiếu, một khoản học phí đã lên kế hoạch, hoặc đơn giản là giữ tiền cho nhu cầu chưa chắc chắn. Nếu chiếc điện thoại hiện tại vẫn đáp ứng công việc và phương án thay thế giúp bạn giảm một rủi ro quan trọng hơn, giá trị của phương án bị bỏ lại có thể lớn hơn mức giảm giá. Ngược lại, nếu máy cũ làm bạn mất dữ liệu, gián đoạn công việc, và bạn đã có quỹ dự phòng, mua mới có thể hoàn toàn hợp lý."},{"speaker":"narrator","purpose":"situation","voiceover":"Ví dụ thứ hai: sau giờ làm, bạn có ba tiếng rảnh và nhận lời hỗ trợ một dự án phụ. Dự án có thể thú vị, có thể mang lại thêm thu nhập, nên nói đồng ý nghe rất hợp lý. Tuy nhiên, ba tiếng ấy không tự sinh thêm. Nếu tuần đó bạn đang thiếu ngủ, có một việc chính sắp đến hạn, hoặc đã hứa dành thời gian cho con, chi phí cơ hội của dự án phụ là lợi ích cụ thể từ lựa chọn tốt nhất bị thay thế. Đây không phải lời khuyên rằng lúc nào cũng phải nghỉ hay lúc nào cũng phải ưu tiên gia đình. Điểm cần nhìn là một giờ làm thêm không chỉ đổi lấy tiền; nó còn đổi lấy một giờ không thể dùng để phục hồi, hoàn thành cam kết, hay giữ chất lượng cho công việc chính."},{"speaker":"narrator","purpose":"core_answer","voiceover":"Sai lầm phổ biến là so sánh lựa chọn đang có với con số không: “Nếu không mua thì chẳng được gì”, hoặc “Nếu không nhận việc thì chỉ ngồi không”. So sánh như vậy làm lựa chọn hiện tại trông hấp dẫn hơn thực tế. Cách so sánh đúng hơn là với phương án tốt nhất bạn có thể và thực sự sẽ làm nếu nói không. Từ “thực sự” rất quan trọng. Đừng tự tạo một phương án thay thế hoàn hảo như tập thể dục hai tiếng mỗi ngày, đọc hết một cuốn sách, làm thêm việc và ngủ đủ, nếu bạn biết mình không có khả năng thực hiện. Chi phí cơ hội hữu ích phải dựa trên một thay thế đáng tin: đã có lịch, đã có nhu cầu, hoặc là cách dùng nguồn lực phù hợp với ưu tiên hiện tại."},{"speaker":"narrator","purpose":"evidence","voiceover":"Có những lúc không cần tính chi phí cơ hội chi li. Với lựa chọn nhỏ, lặp lại, ít ảnh hưởng và dễ đảo ngược, chi phí suy nghĩ có thể lớn hơn lợi ích của việc phân tích. Chọn một bữa trưa trong vài lựa chọn tương đương, mua một món thiết yếu trong ngân sách đã định, hay đổi chỗ ngồi để làm việc dễ chịu hơn thường không cần lập bảng so sánh. Cũng không nên dùng khái niệm này để phủ nhận nghỉ ngơi, niềm vui, hay sự tử tế với người khác chỉ vì chúng không tạo ra kết quả đo ngay được. Nghỉ ngơi có thể là phương án tốt nhất khi nó bảo vệ sức khỏe và năng lượng. Điều cần xem là quy mô, tính khó đảo ngược, và việc lựa chọn đó có chen vào một ưu tiên rõ ràng hay không."},{"speaker":"narrator","purpose":"application","voiceover":"Bạn nên rà chi phí cơ hội khi lựa chọn có một trong ba dấu hiệu: nó dùng nhiều tiền hoặc thời gian; khó đảo ngược sau khi chọn; hoặc có khả năng đẩy lùi một cam kết quan trọng. Khi gặp một quyết định như vậy, hãy viết rất ngắn hai dòng. Dòng một: “Tôi nhận được gì nếu chọn việc này?” Dòng hai: “Phương án tốt nhất tôi bỏ lại là gì, và giá trị của nó nằm ở đâu?” Giá trị có thể là tiền, thời gian, chất lượng công việc, sự hồi phục, quan hệ, hoặc giảm rủi ro. Viết ra giúp bạn nhìn phương án bị bỏ lại như một đối tượng cụ thể, thay vì để nó mơ hồ rồi biến thành cảm giác tiếc nuối sau này."},{"speaker":"narrator","purpose":"application","voiceover":"Sau đó, thêm một câu kiểm tra: “Nếu tôi không chọn việc này, tôi có thật sự dùng nguồn lực đó cho phương án kia không?” Nếu câu trả lời là không, chi phí cơ hội bạn đang tưởng tượng có thể bị phóng đại. Nếu câu trả lời là có, hãy so sánh theo ưu tiên hiện tại chứ không theo áp lực nhất thời. Chẳng hạn, bạn muốn mua điện thoại nhưng quỹ dự phòng là mục tiêu ưu tiên trong ba tháng tới. Bạn không cần kết luận điện thoại là xấu; bạn chỉ cần gọi đúng tên đánh đổi: mua ngay nghĩa là chậm mục tiêu dự phòng một khoảng cụ thể. Khi đã gọi tên được, bạn có thể chọn mua, hoãn, hoặc tìm một phương án trung gian mà không tự lừa mình rằng chẳng có gì bị mất."},{"speaker":"narrator","purpose":"payoff","voiceover":"Nếu cách nhìn này giúp bạn thấy rõ hơn khoản tiền, thời gian hoặc năng lượng đang đánh đổi, hãy nhấn thích để video đến với những người cũng đang cần một cách quyết định bớt mơ hồ. Những gì bạn vừa có không phải công thức để tối ưu mọi phút trong ngày, mà là một câu hỏi để nhìn cả phần được lẫn phần phải nhường. Ở tập sau, chúng ta có thể đi tiếp vào một cơ chế gần với nó: vì sao những gì đã bỏ ra lại khiến ta khó dừng một lựa chọn, ngay cả khi hiện tại nó không còn phù hợp. Hãy mở ghi chú và viết hai dòng cho một quyết định bạn đang cân nhắc trong 5 phút tới: điều bạn nhận được, và phương án tốt nhất bạn sẽ từ bỏ. Nếu thấy hữu ích, hãy đăng ký kênh 1 Cốc Café 6h để xem các video tiếp theo."}],"machine":{"source":"script.quality_review.qa","passed":false,"overall_score":null,"dimension_scores":{},"violated_rules":["hook"],"blocking_findings":["Hook 3-5 giây đầu chưa đủ mạnh hoặc chưa có nghịch lý/vấn đề rõ."]}},{"id":"15e4d5dedb1bd249","title":"Càng Chuẩn Bị Kỹ, Càng Khó Mở Slide Đầu Tiên","profile":"one-cup-cafe-6h","videoType":"long","sectionCount":13,"totalChars":6068,"sections":[{"speaker":"narrator","purpose":"situation","voiceover":"22 giờ đêm. Slide đã xong từ chiều, bạn ngồi trước laptop, ngón tay đặt lên phím F5. Chỉ cần một cái nhấn để chạy trình chiếu. Nhưng bạn không nhấn. Bạn mở lại phần ghi chú, sửa một dấu chấm, đổi font chữ, rồi đóng máy tính. Sáng mai là buổi thuyết trình quan trọng, có sếp, có khách, có người sẽ đánh giá bạn. Bạn càng chuẩn bị kỹ bao nhiêu, khoảnh khắc mở slide đầu tiên càng giống như đứng trước vạch xuất phát mà chân không nhấc lên nổi. Cái giá không phải là một slide lỗi, mà là đêm cuối cùng bạn dùng để né chính bài mình đã làm. Và điều khó hiểu là: bài không tệ, bạn không lười, nhưng bạn vẫn không thể mở nó."},{"speaker":"narrator","purpose":"core_answer","voiceover":"Điều bạn đang gặp không nằm ở chất lượng bài thuyết trình, mà nằm ở cách bạn biến khoảnh khắc mở đầu thành một bài kiểm tra bản thân. Càng chuẩn bị kỹ, bạn càng có nhiều tiêu chuẩn để so sánh chính mình với phiên bản hoàn hảo trong đầu. Lúc mở slide, bạn không còn nghĩ về nội dung, mà nghĩ về việc người khác sẽ thấy bạn có đúng như những gì bạn đã tập hay không. Chính lớp so sánh đó làm tê liệt động tác đầu tiên."},{"speaker":"narrator","purpose":"evidence","voiceover":"Triệu chứng rất dễ nhận ra nếu bạn để ý. Một, bạn đọc lại slide đầu tiên đến mức thuộc từng chữ nhưng vẫn thấy cần sửa thêm. Hai, bạn mở máy lên rồi tắt, hoặc lướt điện thoại vì cảm giác 'để não nghỉ đã'. Ba, khi tưởng tượng cảnh bước lên bục, bạn thấy tim đập nhanh hơn dù chưa ai nói gì. Những hành vi này không phải dấu hiệu của người lười chuẩn bị. Chúng là dấu hiệu của một hệ thần kinh đang coi khoảnh khắc mở đầu là mối đe doạ."},{"speaker":"narrator","purpose":"evidence","voiceover":"Cơ chế đứng sau là vòng lặp an toàn giả. Khi bạn chuẩn bị thêm một lần, bạn nghĩ mình đang giảm rủi ro. Nhưng mỗi lần bạn kiểm tra lại slide, não ghi nhận một tín hiệu: 'Việc này quan trọng đến mức phải kiểm tra lần nữa.' Tín hiệu đó làm tăng trọng số của sai lầm. Bạn càng chuẩn bị nhiều, não càng tin rằng mở đầu là khoảnh khắc dễ hỏng. Kết quả là bạn đứng yên, vì bất kỳ động tác mở nào cũng có thể phá vỡ cái tiêu chuẩn bạn vừa dựng lên."},{"speaker":"narrator","purpose":"evidence","voiceover":"Các nghiên cứu về hiện tượng 'nghẹt thở dưới áp lực' quan sát thấy: khi một kỹ năng đã quen được thực hiện trong trạng thái tự giám sát quá mức, người thực hiện bắt đầu điều khiển từng bước nhỏ mà đáng lẽ nên chạy tự động. Với thuyết trình, bước nhỏ đó là câu đầu tiên. Bạn cố nhớ chính xác mình sẽ nói gì, đứng đâu, tay đặt thế nào; càng cố, câu đầu càng tắc. Đây không phải do bạn yếu, mà do bộ não đã chuyển một hành động bình thường thành một thao tác phải giám sát từng chi tiết."},{"speaker":"narrator","purpose":"evidence","voiceover":"Còn một triệu chứng khác dễ bị bỏ qua vì nhìn giống như làm việc chăm chỉ. Đêm đó, bạn không chỉ đọc lại slide; bạn mở phần ghi chú, thêm một gạch đầu dòng, rồi xóa nó. Bạn vào trình duyệt gõ 'cách mở bài thuyết trình thu hút', đọc năm phút, rồi quay lại slide, nhưng vẫn không nhấn F5. Mỗi lần rời đi rồi quay lại, não nhận thêm một bằng chứng rằng khoảnh khắc mở đầu là chưa an toàn. Chuẩn bị kiểu này không còn phục vụ nội dung nữa, mà phục vụ cảm giác mình đang làm gì đó có ích trong khi thật ra bạn đang lùi giờ bước lên bục."},{"speaker":"narrator","purpose":"evidence","voiceover":"Ví dụ cụ thể hơn: bạn tập câu mở trong đầu, chưa nói thành tiếng, và ngay khi đến chữ 'kính thưa', bạn cảm thấy mình đang diễn cho một ban giám khảo vô hình chấm từng âm. Cảm giác này làm giọng bạn tắt ở cổ, nên bạn tự hứa 'tối nay sẽ tập lại lúc khỏe hơn'. Nhưng tối nay chính là lúc bạn né. Cơ chế vòng lặp an toàn giả ở đây không nằm ở thao tác chuẩn bị, mà ở cách não đổi mục tiêu từ 'mở được slide' thành 'mở mà không được sai'. Mục tiêu thứ hai không có điểm dừng, nên bạn cứ chuẩn bị thêm mãi."},{"speaker":"narrator","purpose":"application","voiceover":"Cách xử lý thực tế không phải là bớt chuẩn bị, mà là đổi chỗ cho lần kiểm tra cuối cùng. Thay vì mở slide đầu tiên để đánh giá bản thân, hãy chọn trước một câu mở cố định, viết ra giấy đúng một dòng, và chỉ tập câu đó với giọng nói to trong một phút. Ví dụ: 'Hôm nay tôi sẽ trình bày ba con số cho thấy vì sao chúng ta cần thay đổi.' Câu này không cần hay, chỉ cần lặp lại được. Khi bạn đã có một điểm bắt đầu không phụ thuộc vào cảm hứng, não sẽ không còn phải chọn giữa hàng chục cách mở."},{"speaker":"narrator","purpose":"application","voiceover":"Vì sao bước này chạm đúng nguyên nhân? Nó hạ mức độ tự giám sát ở đúng giây đầu tiên. Khi câu mở đã được cố định, bạn không cần dừng lại để kiểm tra xem mình có đang nói đúng không. Não chuyển từ kiểm soát từng chữ sang nhận diện phản ứng của người nghe. Đó là trạng thái cần thiết để ba giây tiếp theo trôi đi tự nhiên thay vì đông cứng. Nói cách khác, bạn không cần can đảm hơn; bạn cần bớt quyết định trong giây đầu."},{"speaker":"narrator","purpose":"application","voiceover":"Nhưng cơ chế này có giới hạn rõ. Nếu bạn thấy căng thẳng đi kèm với đau ngực, khó thở kéo dài, hoặc tránh né lan sang cả những việc nhỏ không liên quan, thì đây có thể không còn là phản ứng trước bài thuyết trình. Khi đó, một câu mở cố định không phải là can thiệp phù hợp; bạn nên tìm người có chuyên môn để được đánh giá. Ngoài ra, nếu nội dung chưa thực sự đủ ý, việc dùng mẹo mở đầu có thể che giấu một lỗ hổng thật. Bước này chỉ áp dụng khi bài đã sẵn sàng, và vấn đề nằm ở phản ứng tâm lý, không phải ở kiến thức."},{"speaker":"narrator","purpose":"application","voiceover":"Một cách để biết bài đã sẵn sàng hay chưa: chọn một người bạn tin, đưa họ đúng hai slide đầu, và hỏi một câu hẹp: 'Chỗ nào chưa rõ?' Không hỏi 'bạn thấy thế nào' vì câu đó quá rộng sẽ khiến bạn lại rơi vào đánh giá hình ảnh. Khi họ chỉ ra một điểm mơ hồ, bạn sửa đúng điểm đó, rồi dừng. Việc hỏi hẹp giúp não phân biệt giữa 'bài chưa đủ' và 'sợ bị đánh giá'. Hai thứ này thường bị nhập vào nhau khi bạn chuẩn bị quá lâu."},{"speaker":"narrator","purpose":"payoff","voiceover":"Việc bạn có thể làm hôm nay là thế này. Tối nay, mở slide đầu tiên, bật chế độ ghi âm trên điện thoại, và nói to câu mở đã chọn trong một phút, không được dừng để sửa. Ngày mai trước khi trình bày, bạn làm lại đúng một lần. Kết quả quan sát được không phải là hết run, mà là bạn dừng lại ở slide đầu ít hơn. Có thể tay vẫn run, giọng vẫn hơi khô; nhưng bạn sẽ không còn đứng im vì mắc kẹt trong việc kiểm tra chính mình. Đó là tín hiệu cho thấy cơ chế đã bắt đầu đổi hướng."},{"speaker":"narrator","purpose":"payoff","voiceover":"Và nếu sau vài lần, bạn vẫn thấy câu mở cố định chưa đủ, câu hỏi còn lại là: bạn đang chuẩn bị cho một bài thuyết trình, hay đang chuẩn bị cho hình ảnh người thuyết trình? Hai việc này dùng hai phần khác nhau của não. Video sau tôi sẽ bàn về cách thoát khỏi vòng lặp 'chuẩn bị để cảm thấy an toàn' mà không bao giờ bắt đầu."}],"machine":{"source":"script.quality_review.qa","passed":false,"overall_score":null,"dimension_scores":{},"violated_rules":["immediate_action"],"blocking_findings":["Phần chốt chưa có một hành động có thể làm ngay sau khi xem."]}},{"id":"04a69873a1ebda95","title":"48 Phút, Dòng Rủi Ro Chưa Báo","profile":"ban-so-6","videoType":"short","sectionCount":9,"totalChars":691,"sections":[{"speaker":"narrator","purpose":"situation","voiceover":"Còn 48 phút, nhưng Minh chưa dám báo số cũ."},{"speaker":"narrator","purpose":"core_answer","voiceover":"Im lặng sẽ làm mất chỗ để người khác xác nhận lại."},{"speaker":"an","purpose":"evidence","voiceover":"Dòng trống này là gì?"},{"speaker":"minh","purpose":"evidence","voiceover":"Số mới không phải của em. Em chưa được quyền sửa."},{"speaker":"an","purpose":"evidence","voiceover":"Còn số cũ?"},{"speaker":"narrator","purpose":"application","voiceover":"Minh gập máy lại. Câu 'Còn số cũ?' của An vẫn đi theo cậu, cậu nhìn đồng hồ còn 48 phút rồi đứng lên."},{"speaker":"minh","purpose":"application","voiceover":"Dữ liệu này cũ hơn hai ngày, em chưa đối chiếu xong."},{"speaker":"narrator","purpose":"evidence","voiceover":"Người phụ trách gật nhẹ, bảo Minh ghi rủi ro lại và đối chiếu trước cuối ngày. Minh đáp vâng, rồi ghi chú vào giấy."},{"speaker":"narrator","purpose":"payoff","voiceover":"Có lẽ bạn từng nói ra một điều chưa chắc và nhận về một hạn chót thay vì câu trả lời. Việc đối chiếu còn dang dở có thể khiến bạn khó chịu, nhưng đó là hệ quả của lựa chọn đã lên tiếng. Tập sau, hẹn gặp lại ở video dài minh-neu-rui-ro-trong-cuoc-hop."}],"machine":{"source":"script.quality_review.qa","passed":false,"overall_score":null,"dimension_scores":{},"violated_rules":["editorial_review"],"blocking_findings":["Minh's personal stake is never made concrete; reporting old data costs nothing visible beyond a deadline.","The later meeting does not earn the core answer: the response creates a verification task, not a clearly lost or gained chance for confirmation.","An is only two prompt lines and then disappears, so she reads as an audience device rather than a person with her own life.","The ending names the meaning of the unfinished reconciliation instead of staying with the feedback already shown.","Điểm biên tập 7/10 dưới ngưỡng 9/10 của profile.","Các tiêu chí dưới ngưỡng 9/10: causal_coherence, human_truth, role_fidelity, useful_restraint."]}},{"id":"17ea5a8a2dac67b6","title":"Tiền Thưởng Vừa Về, Vì Sao Món Ngoài Kế Hoạch Bỗng Có Vẻ Hợp Lý?","profile":"legacy-pre-profile","videoType":"short","sectionCount":6,"totalChars":3970,"sections":[{"speaker":"narrator","purpose":"situation","voiceover":"Thông báo tiền thưởng vừa hiện lên, nhưng bạn đã mở giỏ hàng cho đôi giày vốn không nằm trong kế hoạch tháng. Vấn đề có thể không nằm ở kỷ luật, mà ở nhãn bạn vừa đặt cho khoản tiền mới."},{"speaker":"narrator","purpose":"core_answer","voiceover":"Một khoản tiền thưởng có thể được nhìn như một khoản tiền riêng để chi, thay vì phần của cùng ngân sách đang dùng. Tâm lý học hành vi gọi cách con người tự chia, gắn nhãn và theo dõi tiền theo từng “ngăn” là hạch toán tinh thần. Theo tổng quan của Richard Thaler, nguồn tiền và mục đích chi có thể được gắn nhãn thành những tài khoản riêng. Khi nhãn là “thưởng”, câu hỏi trong đầu có thể đổi từ “tháng này còn bao nhiêu?” thành “mình sẽ tự thưởng gì?”. Số tiền không đổi, nhưng phép so sánh có thể đổi: khoản đó bị tách khỏi tiền ăn, tiền đi lại hoặc việc đã dự tính. Điều này không nói rằng mọi người nhận thưởng đều chi ngoài kế hoạch, cũng không phải phán xét tính cách. Nó chỉ gợi một câu hỏi kiểm tra được trước khi bấm mua: bạn đang so món này với ngân sách cả tháng, hay chỉ với nhãn “tiền thưởng”?"},{"speaker":"narrator","purpose":"evidence","voiceover":"Điểm cần giữ lại không phải là “tiền thưởng khiến người ta mất kiểm soát”. Bài nghiên cứu “The Psychology of Windfall Gains” của Arkes và cộng sự kiểm tra giả thuyết rằng khoản nhận bất ngờ có thể được chi dễ hơn các tài sản khác. Trong hai thí nghiệm dùng tiền thật, nhóm sinh viên chỉ biết về khoản trả công khi đến thí nghiệm đã đặt cược nhiều hơn trong một trò chơi, và chi nhiều hơn tại một trận bóng rổ, so với nhóm được báo trước. Các tác giả liên hệ kết quả với tính không được dự đoán trước của khoản nhận. Đây là khác biệt giữa các nhóm trong bối cảnh nghiên cứu, không thể dùng để dự đoán một cá nhân sẽ làm gì hay kết luận việc mua là đúng hoặc sai. Nó chỉ cho ta câu hỏi hữu ích: tính “mới đến” của khoản tiền có đang làm kế hoạch đã có rời khỏi phép so sánh hay không?"},{"speaker":"narrator","purpose":"evidence","voiceover":"Hãy thử một ví dụ giả định. Sáng thứ Sáu, Lan nhận 1.500.000 đồng thưởng dự án. Tuần trước, cô quyết định chưa mua tai nghe vì muốn giữ phần còn lại cho các chi phí tháng này. Đến trưa, ứng dụng mua sắm gửi thông báo về đúng mẫu tai nghe đó. Nếu Lan nghĩ “đây là tiền thưởng, mua một lần cũng được”, cô đang đổi nhãn của khoản tiền trước khi đổi quyết định. Cái dễ bỏ sót không phải giá tai nghe, mà là phép so sánh: cô đang so món đó với số tiền vừa đến, thay vì với toàn bộ phần còn lại và những việc đã dành chỗ. Ví dụ không khẳng định Lan sẽ mua, cũng không nói mua là sai. Nó chỉ minh họa khoảnh khắc nhãn “thưởng” có thể khiến kế hoạch cũ khuất khỏi màn hình, để Lan có cơ hội nhìn lại thay vì tự gán một phán xét đạo đức cho món đồ."},{"speaker":"narrator","purpose":"application","voiceover":"Thử một bước nhỏ, không phải cấm tự thưởng: trước khi mở trang thanh toán, viết một dòng: “Khoản này sẽ đứng ở đâu trong kế hoạch tháng?”. Sau đó đặt tiền thưởng cạnh hai con số bạn đã dùng để quyết định trước đó: phần tiền còn lại trong tháng và khoản đang cần dành chỗ. Nếu vẫn muốn mua, hãy ghi món đó sẽ thay thế cho mục nào. Nếu chưa biết thay thế gì, bạn có thể để quyết định sang ngày hôm sau. Việc viết không biến ai thành người chi tiêu hoàn hảo; nó chỉ đưa khoản tiền từ nhãn “ngoài lệ” trở lại cùng phép so sánh với các lựa chọn khác. Đây là thao tác ghi chép để làm rõ lựa chọn, không phải quy tắc tài chính phù hợp với tất cả mọi người. Nếu bước này giúp bạn nhận ra nhãn “thưởng” trước món đồ, hãy lưu video để dùng vào lần nhận khoản tiền tiếp theo."},{"speaker":"narrator","purpose":"payoff","voiceover":"Trọng tâm không phải là trách bản thân vì muốn tận hưởng tiền thưởng. Trọng tâm là nhận diện lúc một nhãn mới che khuất một kế hoạch cũ. Bạn không cần tự hứa sẽ không mua gì; chỉ cần nhìn thấy phép so sánh đang bị bỏ quên. Hãy mở ghi chú trong 60 giây khi nhận khoản thưởng tiếp theo, ghi tên khoản tiền và viết: “Món này sẽ thay thế phần nào trong kế hoạch tháng?”. Nếu muốn hiểu sâu hơn vì sao một khoản tiền mới có thể được đối xử khác với tiền đã có, video dài “Vì Sao Tiền Thưởng Dễ Biến Thành Khoản Chi Ngoài Kế Hoạch?” sẽ đi tiếp từ chính câu hỏi đó. Thấy cách giải thích này hữu ích thì bấm thích video; đăng ký kênh 1 Cốc Café 6h để xem các video sau về tâm lý tài chính có kiểm chứng."}],"machine":{"source":"script.quality_review.qa","passed":false,"overall_score":null,"dimension_scores":{},"violated_rules":["health_finance_claim"],"blocking_findings":["Phát hiện tuyên bố y tế/tài chính tuyệt đối hoặc áp dụng cho mọi người."]}},{"id":"5c6e30023fee17c6","title":"Bạn Càng Sửa Câu Mở Đầu, Càng Khó Bấm Trình Chiếu","profile":"one-cup-cafe-6h","videoType":"short","sectionCount":4,"totalChars":651,"sections":[{"speaker":"narrator","purpose":"situation","voiceover":"Bạn sửa mãi câu mở đầu. Vì sao càng sửa càng khó bấm trình chiếu?"},{"speaker":"narrator","purpose":"core_answer","voiceover":"Không phải slide dở, mà vì mỗi lần nhìn bạn lại thấy thêm một chỗ chưa hoàn hảo; việc sửa trở thành cách né khoảnh khắc phải nói câu đầu tiên thành tiếng."},{"speaker":"narra
