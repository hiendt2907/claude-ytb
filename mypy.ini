; Type-check configuration.
;
; The codebase is not strict-clean today: 110 errors across 29 of 138 files at
; these baseline settings (measured 2026-09-04). Turning `strict` on globally
; would make the gate unusable, so the rule is asymmetric on purpose:
;
;   * modules introduced by the production-engine refactor are strict from
;     their first commit — see the per-package sections below;
;   * pre-existing modules keep the lenient baseline, and the standard a change
;     must meet is *no regression*: the error count for a file you touch must
;     not go up.
;
; Check a file before and after a change:
;   PYTHONPATH=src .venv/bin/mypy --config-file mypy.ini <path> | tail -1

[mypy]
python_version = 3.13
mypy_path = src
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
show_error_codes = True
; Not enabled globally yet: disallow_untyped_defs, disallow_any_generics,
; warn_return_any. Each becomes reachable as the packages below take over the
; call sites that currently need them off.

; --- Refactor-owned packages: strict from the first commit -------------------
; These do not exist yet. Declaring them here means Step 2 onward cannot land
; untyped code by omission.

[mypy-ytb_pipeline.contract.*]
strict = True

[mypy-ytb_pipeline.observability.*]
strict = True

[mypy-ytb_pipeline.repair.*]
strict = True

; --- Third-party without stubs ----------------------------------------------

[mypy-moviepy.*]
ignore_missing_imports = True

[mypy-googleapiclient.*]
ignore_missing_imports = True

[mypy-google_auth_oauthlib.*]
ignore_missing_imports = True
