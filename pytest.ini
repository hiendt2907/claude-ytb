[pytest]
pythonpath = src
asyncio_mode = auto
testpaths = tests
; --cov-fail-under enforces the 80% floor the constitution already required but
; nothing checked. Measured 83% on 2026-09-04, so the floor bites on regression,
; not on the current state.
addopts = --cov=ytb_pipeline --cov-report=term-missing --cov-fail-under=80 -m "not e2e and not integration and not slow"
markers =
    unit: isolated deterministic test
    e2e: deterministic end-to-end pipeline test; excluded from default unit suite
    integration: test across real local process/dependency boundaries
    slow: test intentionally unsuitable for the default feedback loop
