{% extends "base.html" %}
{% block title %}Đăng nhập — claude-ytb{% endblock %}
{% block body %}
<div class="login-wrap">
  <form class="card login-card" method="post" action="/login">
    <h1 style="margin:0 0 0.3rem; font-size:1.5rem; font-weight:800;">claude<span style="color:var(--accent)">·</span>ytb</h1>
    <p class="muted" style="margin-top:0; font-size:0.85rem;">Bảng điều khiển pipeline</p>
    <div class="field">
      <label for="password">Mật khẩu</label>
      <input type="password" id="password" name="password" autofocus autocomplete="current-password">
    </div>
    <button type="submit" style="width:100%;">Vào dashboard</button>
    {% if error %}<p class="error">{{ error }}</p>{% endif %}
  </form>
</div>
{% endblock %}
