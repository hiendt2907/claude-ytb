[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-render"
version = "0.3.0"
description = "Localhost video assembler for KOL/KOC/affiliate batch rendering."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "edge-tts>=6.1",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.120",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27",
]
build = [
    "pyinstaller>=6.0",
    "static-ffmpeg>=3.0",
]

[project.scripts]
video-render = "ytb_pipeline.webui.app:main"
video-render-cli = "ytb_pipeline.assembler.cli:main"
video-render-desktop = "ytb_pipeline.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ytb_pipeline.webui" = ["templates/*.html"]
